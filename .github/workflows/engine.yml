# The Instagram engine's heartbeat. Daily production run plus a weekly
# kill/scale report, entirely on GitHub-hosted runners. Add the secrets listed
# in engine/README.md and it publishes; without them it still renders and
# uploads each day's Reels as workflow artifacts for manual posting.
name: engine

on:
  schedule:
    - cron: "30 8 * * *"   # daily production, 18:00 Adelaide (ACST)
    - cron: "0 22 * * 6"   # weekly report, Sunday morning local
  workflow_dispatch:
    inputs:
      step:
        description: daily or report
        default: daily

permissions:
  contents: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    if: github.ref_name == 'claude/instagram-audience-monetization-dk481u' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/instagram-audience-monetization-dk481u

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-liberation
          pip install -q -r engine/requirements.txt

      - name: Decide step
        id: step
        run: |
          STEP="${{ github.event.inputs.step || 'daily' }}"
          if [ "${{ github.event.schedule }}" = "0 22 * * 6" ]; then STEP=report; fi
          echo "step=$STEP" >> "$GITHUB_OUTPUT"

      - name: Run engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_USER_ID_MONEY: ${{ secrets.IG_USER_ID_MONEY }}
          IG_USER_ID_AITOOLS: ${{ secrets.IG_USER_ID_AITOOLS }}
          IG_USER_ID_HEALTH: ${{ secrets.IG_USER_ID_HEALTH }}
        run: python engine/run.py "${{ steps.step.outputs.step }}"

      - name: Upload rendered reels
        if: steps.step.outputs.step == 'daily'
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_id }}
          path: engine/out/**/*.mp4
          retention-days: 14
          if-no-files-found: warn

      - name: Commit ledger and report
        run: |
          git config user.name "engine"
          git config user.email "actions@users.noreply.github.com"
          git add engine/state
          git diff --cached --quiet || git commit -m "engine: ${{ steps.step.outputs.step }} run"
          git push
