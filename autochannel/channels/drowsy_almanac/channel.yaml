# The Drowsy Almanac (anonymous). Plan: ../PORTFOLIO.md. Only what differs from ../defaults.yaml.
# Visual sources (build list): Very slow pans over public-domain paintings, engravings, old maps and calm nature stock; dark palette, 60-90 seconds per image, no text on screen.

channel_name: "The Drowsy Almanac"

writer:
  monthly_budget_usd: 8
  batch_size: 2

format:
  target_seconds: 7200
  max_seconds: 11000

voice:
  file: voices/aaron-sleep.safetensors
  speed: 0.88
  loudness: -20
  sentence_pause: 0.6

visuals:
  clip_seconds: 75
  darken: 0.65
  captions:
    enabled: false
    colour: "#F1E9DA"
    highlight: "#F1E9DA"

publish:
  days: [sun]
  category_id: "27"
  description_footer: |
    Narration synthesised with Kyutai Pocket TTS (CC BY 4.0).

council:
  reviewers: [chief, viewer, ear, slop, policy, calm, factcheck]

thumbnail:
  font: PlayfairDisplay.ttf
  uppercase: false
  accent_colour: '#F1E9DA'
  contrast: 0.95
  saturation: 0.8
  brightness: 0.75
  tint: '#2a1d10'
  tint_strength: 0.2
  vignette: 0.6
  text_scrim: 0.6
