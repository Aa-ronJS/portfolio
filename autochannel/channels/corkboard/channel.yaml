# Corkboard Theories (anonymous). Plan: ../PORTFOLIO.md. Only what differs from ../defaults.yaml.
# Visuals (build list): gameplay from the channel's own footage library (FOOTAGE.md) for games whose publisher allows it; for film/TV, evidence-board cards with few short clips; mood stock. Never trailers, music or AI character art.

channel_name: "Corkboard Theories"

writer:
  monthly_budget_usd: 6.4
  batch_size: 4

format:
  target_seconds: 1000
  max_seconds: 1800

voice:
  file: voices/aaron-brisk.safetensors
  speed: 1.05

visuals:
  sources: [library, openverse, pixabay]
  clip_seconds: 5
  darken: 0.55
  captions:
    enabled: true
    colour: "#FFFFFF"
    highlight: "#E63946"

publish:
  days: [wed, sun]
  category_id: "24"
  description_footer: |
    Narration synthesised with Kyutai Pocket TTS (CC BY 4.0).

council:
  reviewers: [chief, viewer, retention, ear, slop, policy, logic, originality]

thumbnail:
  font: BebasNeue-Regular.ttf
  accent_colour: '#E63946'
  contrast: 1.3
  saturation: 1.3
  vignette: 0.4
