# Defaults for every channel. Each channels/<name>/channel.yaml only
# lists what's different for that channel; anything it leaves out comes
# from here. Creative rules live in each channel's RULES.md.

channel_name: "Unnamed"

# --- writing --------------------------------------------------------------
writer:
  model: claude-opus-5-5     # ~$2-2.50 per script that passes the council
  effort: medium
  batch_size: 4              # scripts written per top-up (two weeks at 2/week)
  refill_below: 4            # keep this many approved scripts ahead
  review: true               # true = new scripts wait for you to set
                             # `approved: true` before they can be posted
  monthly_budget_usd: 6.5    # the writers' room stops for the month at this spend

# --- the writers' room (council/README.md) ----------------------------------
council:
  reviewers: [chief, viewer, retention, ear, slop, policy]
  pass_score: 8              # every reviewer must score at least this
  max_rounds: 3              # rewrites before a script is binned
  review_effort: medium
  max_searches: 12           # per research reviewer per round

# --- packaging: titles and thumbnails (ac/packaging.py, ac/reach.py) --------
packaging:
  seats: [pack_click, pack_promise, pack_search]
  thumbnails: true
  thumb_rounds: 3            # render -> art director -> fix, at most this often
  pass_score: 8
  optimise:
    settle_days: 4           # report data lags 2-3 days; judge from day 4
    min_impressions: 500     # don't judge on less
    below_median: 0.85       # swap if click-through < 85% of the channel median
thumbnail:                   # the look; each channel overrides (ac/thumbs.py)
  font: ArchivoBlack-Regular.ttf
  accent_colour: "#FFD23F"

# --- format ---------------------------------------------------------------
format:
  kind: long                 # short = 1080x1920 (<= 3 min); long = 1920x1080
  target_seconds: 600        # 8-12 min; the writer aims for ~1,500 words
  max_seconds: 900           # hard stop: a render longer than this is refused

# --- voice ----------------------------------------------------------------
voice:
  file: voices/aaron-dry.safetensors  # made once with `python -m ac voice-export`
  language: english_2026-10       # pinned: the voice file only fits these weights
  sentence_pause: 0.18            # seconds of silence between sentences
  speed: 1.0                      # >1 speeds up delivery without changing pitch
  loudness: -14                   # LUFS; -14 is YouTube normal, sleep channels ~-20

# --- picture --------------------------------------------------------------
visuals:
  broll: pexels              # pexels (free key, PEXELS_API_KEY) | none
  clip_seconds: 4            # cut to a new background clip this often
  darken: 0.45               # dim the background so captions read
  captions:
    enabled: true
    words_per_card: 3
    size: 0.095              # font height as a fraction of frame width
    colour: "#FFFFFF"
    highlight: "#FFD23F"     # the word being spoken
    position: 0.62           # vertical centre, fraction of frame height
  music: none                # none | path to an mp3/wav you own the rights to
  music_volume: 0.08

# --- publishing -----------------------------------------------------------
publish:
  days: [tue, fri]           # UTC weekdays the robot posts on
  upload: true
  privacy: public            # public | unlisted | private
  publish_hour_utc: null     # e.g. 22 = schedule for 22:00 UTC; null = now
  category_id: "27"          # 27 Education, 24 Entertainment, 28 Sci&Tech
  made_for_kids: false
  # YouTube lists "cloning one's own voice to create voice overs" as a
  # minor edit that needs NO disclosure (support.google.com/youtube/answer/14328491).
  # Set true for any video with realistic AI-generated people or events.
  synthetic_media: false
  default_tags: []
  description_footer: |
    Narration: the creator's own voice, synthesised with Kyutai Pocket TTS (CC BY 4.0).
    Footage: Pexels.
