# Copy to .github/workflows/daily.yml in the channels' private repo.
#
# Every day: one light job writes scripts for any channel whose queue is
# low (Claude only, ~1 min), then one heavy job per channel that posts
# today renders and uploads in parallel (~10-15 min each). Free private-repo
# allowance is 2,000 min/month: enough for ~120 long videos.
#
# Secrets: ANTHROPIC_API_KEY, PEXELS_API_KEY, YT_CLIENT_ID, YT_CLIENT_SECRET
# (shared) and YT_REFRESH_TOKEN_<CHANNEL> per channel, e.g. YT_REFRESH_TOKEN_AARON.
name: daily

on:
  schedule:
    - cron: "17 21 * * *"   # 21:17 UTC = early morning in Australia, afternoon in the US
  workflow_dispatch: {}

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q anthropic==2.10.0 pydantic==2.14.3 PyYAML==6.0.3
      - name: Write scripts where queues are low
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m ac topup
      - id: due
        run: echo "due=$(python -m ac due)" >> "$GITHUB_OUTPUT"
      - name: Save new scripts
        if: always()
        run: |
          git config user.name "autochannel"
          git config user.email "autochannel@users.noreply.github.com"
          git add channels
          git diff --cached --quiet || git commit -q -m "scripts: $(date -u +%F)"
          git pull -q --rebase && git push -q

  post:
    needs: plan
    if: needs.plan.outputs.due != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300           # a 2-hour sleep video renders for ~2-3 hours
    strategy:
      fail-fast: false              # one channel failing never stops the others
      max-parallel: 4
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.due) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }         # pick up the scripts the plan job just pushed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-${{ hashFiles('requirements.txt') }}
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
      - name: Post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          # each channel's job only ever sees its own sign-in
          YT_REFRESH_TOKEN: ${{ secrets[format('YT_REFRESH_TOKEN_{0}', matrix.channel)] }}
        run: python -m ac ${{ matrix.channel }} daily
      - name: Save state
        if: always()
        run: |
          git config user.name "autochannel"
          git config user.email "autochannel@users.noreply.github.com"
          git add channels/${{ matrix.channel }}
          git diff --cached --quiet || git commit -q -m "${{ matrix.channel }}: $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep $((i*3)); done
