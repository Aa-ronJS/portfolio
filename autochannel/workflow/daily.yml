# Copy to .github/workflows/daily.yml in the channels' private repo.
#
# Every day, in parallel:
#   write: one job per channel runs the writers' room (pitch, draft,
#          council review, rewrite) if that channel's queue is low.
#   post:  one job per channel that posts today renders, art-directs
#          its thumbnails and uploads.
#   optimise: one light job per channel reads YouTube's click-through
#          report and swaps title/thumbnail on clearly losing videos.
# Free private-repo allowance is 2,000 min/month; see PORTFOLIO.md for the estimate.
#
# Secrets: ANTHROPIC_API_KEY (+ ANTHROPIC_WORKSPACE_ID for user keys), PIXABAY_API_KEY
# (optional; NASA, Openverse and Internet Archive need no key), YT_CLIENT_ID, YT_CLIENT_SECRET
# (shared) and YT_REFRESH_TOKEN_<CHANNEL> per channel, e.g. YT_REFRESH_TOKEN_AARON.
name: daily

on:
  schedule:
    - cron: "17 21 * * *"   # 21:17 UTC = early morning in Australia, afternoon in the US
  workflow_dispatch: {}

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.p.outputs.all }}
      due: ${{ steps.p.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q PyYAML==6.0.3
      - id: p
        run: |
          echo "all=$(python -m ac channels)" >> "$GITHUB_OUTPUT"
          echo "due=$(python -m ac due)" >> "$GITHUB_OUTPUT"

  write:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.all) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q anthropic==2.10.0 pydantic==2.14.3 PyYAML==6.0.3
      - name: Writers' room
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}   # only for keys not tied to a workspace
        run: python -m ac ${{ matrix.channel }} topup
      - name: Save scripts, rejections and spend
        if: always()
        run: |
          git config user.name "autochannel"
          git config user.email "autochannel@users.noreply.github.com"
          git add channels/${{ matrix.channel }}
          git diff --cached --quiet || git commit -q -m "${{ matrix.channel }} scripts: $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep $((i*3)); done

  post:
    needs: plan
    if: needs.plan.outputs.due != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300           # a 2-hour sleep video renders for ~2-3 hours
    strategy:
      fail-fast: false              # one channel failing never stops the others
      max-parallel: 4
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.due) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-${{ hashFiles('requirements.txt') }}
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
      - name: Post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # thumbnail art direction
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}   # optional
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          # each channel's job only ever sees its own sign-in
          YT_REFRESH_TOKEN: ${{ secrets[format('YT_REFRESH_TOKEN_{0}', matrix.channel)] }}
        run: python -m ac ${{ matrix.channel }} post-today
      - name: Save state
        if: always()
        run: |
          git config user.name "autochannel"
          git config user.email "autochannel@users.noreply.github.com"
          git add channels/${{ matrix.channel }}
          git diff --cached --quiet || git commit -q -m "${{ matrix.channel }}: $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep $((i*3)); done

  optimise:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.all) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q google-api-python-client==2.202.0 google-auth-oauthlib==1.5.0 PyYAML==6.0.3
      - name: Read click-through, swap losing packages
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets[format('YT_REFRESH_TOKEN_{0}', matrix.channel)] }}
        run: python -m ac ${{ matrix.channel }} optimise
      - name: Save state
        if: always()
        run: |
          git config user.name "autochannel"
          git config user.email "autochannel@users.noreply.github.com"
          git add channels/${{ matrix.channel }}
          git diff --cached --quiet || git commit -q -m "${{ matrix.channel }} reach: $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep $((i*3)); done
