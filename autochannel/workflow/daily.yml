# Copy to .github/workflows/daily.yml in the channel's own (private) repo.
# Runs free on GitHub's runners: ~4 minutes a day against the 2,000
# free minutes a month a private repo gets.
name: daily video

on:
  schedule:
    - cron: "17 21 * * 1,4"  # Mon+Thu 21:17 UTC = Tue+Fri morning in Australia; afternoon in the US
  workflow_dispatch: {}     # "Run workflow" button for a manual post

concurrency:
  group: daily-video        # never two runs fighting over the queue
  cancel-in-progress: false

permissions:
  contents: write           # to commit queue/ and posted/ back

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache models (TTS, whisper)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Make and post today's video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m ac daily

      # Runs even when posting failed, so new scripts and error notes are
      # never lost. GitHub emails you when a run fails.
      - name: Save queue state
        if: always()
        run: |
          git config user.name "autochannel"
          git config user.email "autochannel@users.noreply.github.com"
          git add queue posted channel/IDEAS.md
          git diff --cached --quiet || git commit -q -m "daily: $(date -u +%F)"
          git pull -q --rebase && git push -q
