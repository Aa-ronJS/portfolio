<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lineage: sandbox</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#14120e; --panel:rgba(20,18,14,0.92); --line:rgba(237,230,214,0.16); --text:#EDE6D6; --muted:#B8AE9A;
  --accent:#E0A23B; --accent-ink:#1A1406; --good:#8FCB7A; --bad:#F08A6C; --teal:#7FD0C6;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --panel:rgba(20,18,14,0.92); } }
:root[data-theme="light"]{ --panel:rgba(20,18,14,0.92); }
:root[data-theme="dark"]{ --panel:rgba(20,18,14,0.92); }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:var(--text);background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:6px;min-height:40px;padding:0 12px;cursor:pointer}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.top > *{pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;min-height:40px;display:flex;align-items:center;gap:8px}
.chip b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:17px;letter-spacing:1px}
.grow{flex:1}
.card{position:absolute;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 16px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:46%;overflow-y:auto}
.card h2{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;letter-spacing:1px}
.sub{font-size:12px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}
.bar{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
.bar i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,0.1);overflow:hidden}
.bar i span{display:block;height:100%}
.thought{font-size:13px;line-height:1.4}
.row{display:flex;gap:6px;flex-wrap:wrap}
.menu{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 16px));background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;max-height:60%;overflow-y:auto;z-index:5}
.menu h3{margin:0 0 2px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:19px;letter-spacing:1px}
.menu button{text-align:left;min-height:44px}
.side{position:absolute;right:8px;top:calc(60px + env(safe-area-inset-top,0px));width:min(360px,calc(100% - 16px));max-height:calc(100% - 140px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;z-index:4}
.side h3{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:20px;letter-spacing:1px}
.entry{font-size:13px;line-height:1.4;border-top:1px solid var(--line);padding-top:6px}
.entry .t{color:var(--muted);font-size:11px}
.entry.disc{color:#F3D9A6}
.entry.death{color:var(--bad)}
.entry.birth{color:var(--good)}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:#2a2114;border:1px solid var(--accent);color:#F3D9A6;border-radius:8px;padding:10px 14px;font-size:14px;max-width:calc(100% - 24px);z-index:6;pointer-events:none}
.hidden{display:none !important}
.help{font-size:13px;line-height:1.5}
.help p{margin:0 0 8px}
</style>
</head>
<body>
<div id="app">
<canvas id="cv" aria-label="Simulation world"></canvas>
<div class="top">
<div class="chip"><b id="clock">DAY 1</b><span id="season" class="sub"></span></div>
<div class="row">
<button id="sp0" aria-label="Pause">II</button>
<button id="sp1" class="on">1×</button>
<button id="sp3">3×</button>
<button id="sp8">8×</button>
</div>
<div class="grow"></div>
<button id="bLog">Chronicle</button>
<button id="bBeh">Behaviours</button>
<button id="bHelp">How to play</button>
</div>
<div class="card hidden" id="card">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2 id="cName"></h2><span class="sub" id="cMeta"></span></div>
<div class="thought" id="cThought"></div>
<div class="bars" id="cBars"></div>
<div class="sub" id="cHold"></div>
<div class="sub" id="cTask"></div>
<div class="row"><button id="bFollow" class="on">Camera follows</button><button id="bRelease">Release</button></div>
</div>
<div class="menu hidden" id="menu"></div>
<div class="side hidden" id="side"></div>
<div class="toast hidden" id="toast"></div>
</div>

<script>
(function(){
"use strict";
/* ================= utilities ================= */
var seed = (Date.now() % 100000) + 7;
function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function rr(a,b){ return a + rnd()*(b-a); }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function gauss(){ return (rnd()+rnd()+rnd()-1.5)/1.5; }
var nid = 1;
function hash2(x,y){ var s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
function vn(x,y){ var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  var a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y,o){ var s=0,a=0.5,f=1,n=0; for(var i=0;i<o;i++){ s+=a*vn(x*f,y*f); n+=a; a*=0.5; f*=2; } return s/n; }

/* ================= world ================= */
var W = 130, H = 90;
var DEEP=0, SHALLOW=1, SAND=2, GRASS=3, WOOD=4, ROCK=5, BURNT=6;
var tiles = new Uint8Array(W*H), dryness = new Float32Array(W*H), fireT = new Float32Array(W*H), burntT = new Float32Array(W*H);
var off = seed*0.001;
var LX = W*0.42, LY = H*0.55;
for (var y=0;y<H;y++) for (var x=0;x<W;x++){
  var h = fbm(x*0.05+off, y*0.05-off, 5);
  var ld = Math.hypot((x-LX)/1.3, y-LY);
  h -= 0.35*Math.max(0, 1 - ld/22);
  var pd = Math.hypot(x-W*0.82, y-H*0.25); h -= 0.25*Math.max(0, 1 - pd/7);
  h += Math.max(0, (8 - y))/8*0.25;
  var t;
  if (h < 0.24) t = DEEP; else if (h < 0.29) t = SHALLOW; else if (h < 0.32) t = SAND;
  else if (h > 0.72) t = ROCK;
  else t = (fbm(x*0.09+40, y*0.09, 3) > 0.53 && h < 0.6) ? WOOD : GRASS;
  tiles[y*W+x] = t;
}
function T(x,y){ x=Math.floor(x); y=Math.floor(y); if (x<0||y<0||x>=W||y>=H) return ROCK; return tiles[y*W+x]; }
function walkable(x,y){ var t=T(x,y); return t!==DEEP && t!==ROCK; }
function isWater(x,y){ var t=T(x,y); return t===DEEP||t===SHALLOW; }
function nearWater(x,y,r){ var best=null,bd=1e9; for (var dy=-r;dy<=r;dy++) for (var dx=-r;dx<=r;dx++){ var tx=x+dx, ty=y+dy, t=T(tx,ty), d=dx*dx+dy*dy; if (d>=bd) continue; if (t===SHALLOW){ bd=d; best={x:Math.floor(tx)+0.5,y:Math.floor(ty)+0.5}; } else if (t===DEEP){ var nb=[[1,0],[-1,0],[0,1],[0,-1]]; for (var k=0;k<4;k++){ if (walkable(tx+nb[k][0],ty+nb[k][1])){ bd=d; best={x:Math.floor(tx+nb[k][0])+0.5,y:Math.floor(ty+nb[k][1])+0.5}; break; } } } } return best; }

/* ================= item definitions (properties only) ================= */
var IT = {
 berry:   {n:"berries", food:1, cal:15,  perish:0.5, stack:8, small:1, sweet:1, cat:"food", col:"#b33a3a"},
 fig:     {n:"figs", food:1, cal:16,  perish:0.6, stack:6, small:1, sweet:1, ferment:1, cat:"food", col:"#7a3a5a"},
 nut:     {n:"nuts", food:1, cal:16, perish:0.03, stack:8, small:1, shell:0.55, hard:0.5, cat:"food", col:"#8a5a2a"},
 tuber:   {n:"tubers", food:1, cal:14, perish:0.06, stack:4, cook:1, cat:"food", col:"#b08a5a"},
 kernel:  {n:"nut kernels", food:1, cal:16, perish:0.1, stack:8, small:1, cat:"food", col:"#d8b070"},
 mushB:   {n:"brown mushrooms", food:1, cal:6, perish:0.4, stack:6, small:1, cat:"food", col:"#a07850"},
 mushR:   {n:"red mushrooms", food:1, cal:6, perish:0.4, stack:6, small:1, toxic:0.85, cat:"food", col:"#d03030"},
 fish:    {n:"fish", food:1, cal:22, perish:1.2, stack:2, cook:1, cat:"food", col:"#7c9aa8"},
 meat:    {n:"meat", food:1, cal:26, perish:1.4, stack:3, cook:1, cat:"food", col:"#9a2a1e", smell:1},
 rodent:  {n:"small animal", food:1, cal:14, perish:1.2, stack:2, cook:1, cat:"food", col:"#7a6450", smell:1},
 bone:    {n:"bone", hard:0.6, mass:0.4, marrow:1, cat:"animal", col:"#e8e0cc", long:0.5},
 hide:    {n:"hide", warm:1, fuel:0.2, mass:0.4, cat:"animal", col:"#a88a5c", cover:1},
 stone:   {n:"stone", hard:0.85, mass:0.8, brittle:1, cat:"stone", col:"#8f8a80"},
 flake:   {n:"sharp flake", hard:0.85, mass:0.15, sharp:1, cat:"stone", col:"#c8c4b8"},
 stick:   {n:"stick", hard:0.3, mass:0.3, long:1, fuel:1, cat:"wood", col:"#7a5a34"},
 spear:   {n:"pointed stick", hard:0.35, mass:0.35, long:1.2, pointed:1, fuel:1, cat:"wood", col:"#8a6a3a"},
 leaves:  {n:"leaves", fuel:0.6, mass:0.05, cover:1, stack:4, cat:"plant", col:"#4f7a30"},
 gourd:   {n:"gourd", hollow:1, mass:0.3, cat:"plant", col:"#c9b04a"},
 gourdW:  {n:"gourd of water", hollow:1, water:3, mass:0.6, cat:"plant", col:"#6ab0c0"},
 brand:   {n:"burning stick", hard:0.3, long:1, burning:1, mass:0.3, cat:"fire", col:"#ff9a3a"},
 carcass: {n:"carcass", mass:3, carcass:1, smell:1, cat:"animal", col:"#7a3424", big:1}
};
function cat(c){ return IT[c] ? IT[c].cat : c; }

/* ================= entities ================= */
var items = [], sources = [], creatures = [], fires = [], projectiles = [];
var time = 0, DAY = 120; // seconds per day at 1x
function day(){ return time/DAY; }
function hourOf(){ return (day()%1)*24; }
function isNight(){ var h=hourOf(); return h<5.5||h>19.5; }
function seasonOf(){ return (Math.floor(day()/6)%2)===0 ? "wet" : "dry"; }
var raining = false, rainT = 0;

function addItem(cls,x,y,count,opt){ var it={id:nid++,cls:cls,x:x,y:y,count:count||1,fresh:1,wet:0,cooked:false,dried:false,fermented:false,covered:false,burn:0,band:-1,storedKey:null,heldBy:null,hard:false}; if(opt) for (var k in opt) it[k]=opt[k]; items.push(it); return it; }
function removeItem(it){ var i=items.indexOf(it); if(i>=0) items.splice(i,1); }
function addSource(type,x,y,o){ var s={id:nid++,type:type,x:x,y:y,stock:0,max:0,regrow:0,tree:false}; for (var k in o) s[k]=o[k]; sources.push(s); return s; }
function addFire(x,y,fuel){ var f={id:nid++,x:x,y:y,fuel:fuel||1}; fires.push(f); return f; }

function randomTile(pred, tries){ for (var i=0;i<(tries||500);i++){ var x=rnd()*W, y=rnd()*H; if (pred(T(x,y),x,y)) return {x:Math.floor(x)+0.5,y:Math.floor(y)+0.5}; } return null; }

function populate(){
  var p, i;
  for (i=0;i<110;i++){ p=randomTile(function(t){return t===GRASS||t===WOOD;}); if(p) addSource("bush",p.x,p.y,{stock:6,max:8,regrow:5}); }
  for (i=0;i<22;i++){ p=randomTile(function(t,x,y){return (t===GRASS||t===WOOD);}); if(p) addSource("nutTree",p.x,p.y,{tree:true,stock:0,max:10,regrow:4}); }
  for (i=0;i<18;i++){ p=randomTile(function(t,x,y){return (t===WOOD||t===GRASS) && nearWater(x,y,5);}); if(p) addSource("figTree",p.x,p.y,{tree:true,stock:3,max:8,regrow:3}); }
  for (i=0;i<60;i++){ p=randomTile(function(t){return t===WOOD;}); if(p) addSource("tree",p.x,p.y,{tree:true,stock:4,max:4,regrow:2}); }
  for (i=0;i<55;i++){ p=randomTile(function(t){return t===GRASS||t===WOOD;}); if(p) addSource("roots",p.x,p.y,{stock:4,max:5,regrow:1.6}); }
  for (i=0;i<14;i++){ p=randomTile(function(t){return t===GRASS;}); if(p) addSource("mound",p.x,p.y,{stock:20,max:20,regrow:6}); }
  for (i=0;i<14;i++){ p=randomTile(function(t){return t===GRASS||t===SAND;}); if(p) addSource("burrow",p.x,p.y,{stock:2,max:2,regrow:0.6}); }
  for (i=0;i<9;i++){ p=randomTile(function(t,x,y){return (t===SAND||t===GRASS) && nearWater(x,y,3);}); if(p) addSource("vine",p.x,p.y,{stock:2,max:3,regrow:0.5}); }
  for (i=0;i<10;i++){ p=randomTile(function(t,x,y){return t!==ROCK && t!==DEEP && t!==SHALLOW && (T(x+2,y)===ROCK||T(x-2,y)===ROCK||T(x,y+2)===ROCK||T(x,y-2)===ROCK);},3000); if(p) addSource("outcrop",p.x,p.y,{stock:99,max:99,regrow:0}); }
  for (i=0;i<90;i++){ p=randomTile(function(t){return t===GRASS||t===SAND||t===WOOD;}); if(p) addItem("stone",p.x+rr(-0.3,0.3),p.y+rr(-0.3,0.3)); }
  for (i=0;i<120;i++){ p=randomTile(function(t){return t===WOOD;}); if(p) addItem("stick",p.x+rr(-0.3,0.3),p.y+rr(-0.3,0.3)); }
}
populate();

/* ================= genes and names ================= */
var SYL = ["ka","ru","mo","ta","ni","bo","sa","lu","ga","re","po","di","ha","ze","ko","ma","vi","nu","ti","ya"];
function mkName(){ var n=pick(SYL)+pick(SYL)+(rnd()<0.4?pick(SYL):""); return n.charAt(0).toUpperCase()+n.slice(1); }
var GENES = ["size","strength","speed","impulse","curiosity","aggression","sociability","attention","bite","detox","coldTol","hair"];
function baseGenes(robust){ var g={}; GENES.forEach(function(k){ g[k]=clamp(0.5+gauss()*0.12,0.05,0.95); }); if (robust){ g.size+=0.1; g.bite=0.85; g.strength+=0.12; g.curiosity-=0.12; } return g; }
function childGenes(a,b){ var g={}; GENES.forEach(function(k){ g[k]=clamp((a[k]+b[k])/2 + gauss()*0.06, 0.02, 0.98); }); return g; }

/* ================= creatures ================= */
var PLAYER_BAND = 0;
var bands = [{id:0,name:"Your band",col:"#E0A23B"},{id:1,name:"Robust group",col:"#4FB3A9"}];
function mkHom(band,x,y,sex,age,genes){
  var h={id:nid++,kind:"hom",name:mkName(),band:band,sex:sex,age:age,genes:genes,x:x,y:y,vx:0,vy:0,
    hp:1,hunger:rr(0.2,0.5),thirst:rr(0.1,0.4),energy:rr(0.6,1),fear:0,social:rr(0.2,0.5),boredom:0,mate:0,cold:0,sick:0,drunk:0,
    preg:0,lastBirth:-10,rank:rnd(),bonds:{},hold:[null,null],task:null,res:{},skill:{},aversion:{},inTree:null,asleep:false,wear:null,
    thought:"",mother:null,interest:0,lastThink:0,dead:false,lastAct:null,anger:{},tired:0};
  creatures.push(h); return h;
}
function mkAnimal(kind,x,y,o){ var a={id:nid++,kind:kind,x:x,y:y,vx:0,vy:0,hp:1,target:null,state:"idle",t:0,dead:false}; for (var k in o) a[k]=o[k]; creatures.push(a); return a; }
function homs(){ return creatures.filter(function(c){ return c.kind==="hom" && !c.dead; }); }
function stage(h){ return h.age<1.2?"infant":(h.age<6?"juvenile":(h.age<26?"adult":"elder")); }

var start = randomTile(function(t,x,y){ return t===GRASS && nearWater(x,y,6) && x>10 && x<W-10 && y>10 && y<H-10; }, 5000) || {x:W/2,y:H/2};
for (var b=0;b<10;b++){ var sx=b<3?"m":(b<7?"f":(rnd()<0.5?"m":"f")); var ag=b<7?rr(8,18):rr(2,5); mkHom(0,start.x+rr(-3,3),start.y+rr(-3,3),sx,ag,baseGenes(false)); }
var rstart = randomTile(function(t,x,y){ return t===GRASS && nearWater(x,y,6) && Math.hypot(x-start.x,y-start.y)>40; }, 8000) || randomTile(function(t,x,y){ return t===GRASS && Math.hypot(x-start.x,y-start.y)>30; }, 5000) || {x:10,y:10};
for (b=0;b<6;b++){ mkHom(1,rstart.x+rr(-3,3),rstart.y+rr(-3,3),b<3?"m":"f",b<5?rr(8,16):3,baseGenes(true)); }
creatures.filter(function(c){return c.kind==="hom";}).forEach(function(a){ creatures.forEach(function(c){ if(c.kind==="hom" && c!==a && c.band===a.band) a.bonds[c.id]=rr(0.2,0.5); }); });
function herdAt(){ return randomTile(function(t,x,y){ return t===GRASS && Math.hypot(x-start.x,y-start.y)>15; },3000); }
var hp0 = herdAt(); for (b=0;b<14;b++) mkAnimal("antelope",hp0.x+rr(-4,4),hp0.y+rr(-4,4),{wary:5,speed:3.2,hp:1});
var hy = randomTile(function(t,x,y){ return t===GRASS && Math.hypot(x-start.x,y-start.y)>30; },3000); for (b=0;b<3;b++) mkAnimal("hyena",hy.x+rr(-2,2),hy.y+rr(-2,2),{bold:0.55,speed:2.6,hp:1,hunger:0.3});
var lp = randomTile(function(t){ return t===WOOD; },3000) || hy; mkAnimal("leopard",lp.x,lp.y,{bold:0.6,speed:3,hp:1.4,hunger:0.3,home:{x:lp.x,y:lp.y}});
for (b=0;b<3;b++){ var cp=randomTile(function(t,x,y){ return t===DEEP && (T(x+2,y)===SHALLOW||T(x-2,y)===SHALLOW||T(x,y+2)===SHALLOW); },5000); if(cp) mkAnimal("croc",cp.x,cp.y,{hp:2,cool:0}); }
sources.filter(function(s){return s.type==="burrow";}).forEach(function(s){ s.rodents=2; });

/* ================= culture: patterns ================= */
var patterns = {};
var chronicle = [];
function logE(text, cls){ chronicle.unshift({t:day(), text:text, cls:cls||""}); if (chronicle.length>250) chronicle.pop(); if (sideMode==="log") renderSide(); }
function toast(text){ var el=document.getElementById("toast"); el.textContent=text; el.classList.remove("hidden"); clearTimeout(toast.t); toast.t=setTimeout(function(){ el.classList.add("hidden"); }, 4200); }

function resGet(h,k){ var v=h.res[k]; if (v===undefined){ v = 1 - (k.indexOf("|")<0 ? h.genes.curiosity*0.35 : h.genes.curiosity*0.1); } return v; }
function keyParts(verb, held, tgt){ return [verb+"|"+held+"|"+tgt, verb+"|"+cat(held)+"|"+cat(tgt), verb]; }
function effRes(h, verb, held, tgt){ var k=keyParts(verb,held,tgt); return 0.6*resGet(h,k[0]) + 0.25*resGet(h,k[1]) + 0.15*resGet(h,k[2]); }
function reinforce(h, verb, held, tgt, amt){ var k=keyParts(verb,held,tgt); h.res[k[0]]=Math.max(0.02,resGet(h,k[0])-amt); h.res[k[1]]=Math.max(0.02,resGet(h,k[1])-amt*0.5); h.res[k[2]]=Math.max(0.02,resGet(h,k[2])-amt*0.3); }
function skillUp(h, verb, amt){ h.skill[verb]=clamp((h.skill[verb]||0)+amt,0,1); }
function sk(h,verb){ return h.skill[verb]||0; }

var EFFECT_NAMES = {
  store:"Storing {h} instead of eating them", cover:"Covering stored food with {h}", crack:"Cracking {t} with {h}", flake:"Knapping {t} into sharp flakes",
  marrow:"Smashing bones for marrow", butcher:"Butchering carcasses with {h}", sharpen:"Sharpening sticks with {h}", termites:"Fishing for termites with {h}",
  rodentProbe:"Probing burrows with {h}", digStick:"Digging up roots with {h}", digRoots:"Digging roots by hand", digRodent:"Digging out small animals", spearFish:"Spearing fish with {h}", grabFish:"Grabbing fish by hand", shake:"Shaking nuts down with {h}",
  hitAnimal:"Hunting with {h}", scare:"Driving off predators with {h}", cook:"Cooking {h} in the fire", harden:"Fire-hardening {h}", feed:"Feeding the fire with {h}",
  takeFire:"Carrying fire", ignite:"Starting fires with a burning stick", wildfire:"Setting the grass alight", fill:"Carrying water in gourds", drinkGourd:"Drinking from gourds away from water",
  wear:"Wearing hides for warmth", climbSleep:"Sleeping in trees", share:"Sharing {h}", groom:"Grooming", mob:"Mobbing predators together", dry:"Drying {h} on rocks",
  eatToxic:"Eating {h}", avoid:"Avoiding {h}", lead:"Following a leader", copy:"Copying another", dig:"Digging for termites by hand", bury:"Burying food", stack:"Piling {h}"
};
function patName(p){ var n = EFFECT_NAMES[p.effect] || (p.verb+" "+p.held+" "+p.tgt); if (p.held==="none") n=n.replace(" with {h}","").replace("{h}","food"); return n.replace("{h}", IT[p.held]?IT[p.held].n:p.held).replace("{t}", IT[p.tgt]?IT[p.tgt].n:p.tgt); }

function predictedVerb(h){
  var held = h.hold[0];
  if (h.fear>0.55) return "flee";
  if (held && IT[held.cls].food && !IT[held.cls].shell && h.hunger>0.35 && !(h.aversion[held.cls]>0.5)) return "eat";
  if (h.thirst>0.7) return "drink";
  if (isNight() && h.energy<0.4) return "sleep";
  if (h.hunger>0.55) return "forage";
  return "idle";
}

function record(h, verb, held, tgt, effect, payoff, forced, x, y){
  var key = effect+"|"+held+"|"+tgt;
  var p = patterns[key];
  if (!p){ p = patterns[key] = {key:key, verb:verb, held:held, tgt:tgt, effect:effect, count:0, dev:0, payoff:0, prac:{}, recognized:false, x:x, y:y, threat:0, night:0, bands:{}}; }
  p.count++; p.payoff += payoff; p.prac[h.id]=true; p.bands[h.band]=(p.bands[h.band]||0)+1;
  p.x = p.x*0.8 + x*0.2; p.y = p.y*0.8 + y*0.2;
  var pv = h.predicted || "idle";
  if (forced || (pv!==verb && pv!=="idle")) p.dev++;
  if (nearestThreat(h,8)) p.threat++;
  if (isNight()) p.night++;
  var amt = (forced?0.07:0.05) * (0.6 + h.genes.attention*0.8);
  reinforce(h, verb, held, tgt, amt);
  skillUp(h, verb, 0.03);
  creatures.forEach(function(o){
    if (o===h || o.kind!=="hom" || o.dead || o.asleep || dist(o,h)>7) return;
    var bond = (o.bonds[h.id]||0), young = stage(o)==="juvenile" ? 2 : 1, status = h.rank>o.rank ? 1.3 : 1;
    reinforce(o, verb, held, tgt, amt*0.35*(0.5+bond)*young*status*(payoff>0?1.3:0.8));
  });
  if (forced) p.forced=(p.forced||0)+1;
  if (!p.recognized && p.count>=3 && ((p.forced||0)>=2 || p.payoff>=1.5 || p.dev>=3) && p.payoff>-3){
    p.recognized = true; p.name = patName(p);
    var dupe = Object.keys(patterns).some(function(k2){ var q=patterns[k2]; return q!==p && q.recognized && q.name===p.name && q.bands[h.band]; });
    if (dupe) return;
    var who = p.bands[PLAYER_BAND] ? "Your band" : "The robust group";
    logE("New behaviour: "+p.name+" ("+who+")", "disc"); if (p.bands[PLAYER_BAND]) toast("New behaviour recognised: "+p.name);
  }
  if (sideMode==="beh") renderSide();
}

/* ================= helpers for AI ================= */
function nearestThreat(h, r){ var best=null, bd=r; creatures.forEach(function(c){ if(c.dead) return; if ((c.kind==="hyena"||c.kind==="leopard") && c.state!=="flee"){ var d=dist(c,h); if(d<bd){bd=d;best=c;} } if (c.kind==="hom" && h.anger && c.band!==h.band && (h.anger[c.id]||0)>0.5){ var d2=dist(c,h); if(d2<bd){bd=d2;best=c;} } }); return best; }
function nearestItem(h, pred, r){ var best=null, bd=r||25; for (var i=0;i<items.length;i++){ var it=items[i]; if (it.heldBy) continue; if (h.bad && h.bad[it.id]>time) continue; if (!pred(it)) continue; var d=dist(it,h); if (it.covered) d*=3; if (d<bd){bd=d;best=it;} } return best; }
function nearestSource(h, pred, r){ var best=null, bd=r||30; sources.forEach(function(s){ if(!pred(s)) return; if (h.bad && h.bad[s.id]>time) return; var d=dist(s,h); if(d<bd){bd=d;best=s;} }); return best; }
function nearestFire(h,r){ var best=null,bd=r||30; fires.forEach(function(f){ var d=dist(f,h); if(d<bd){bd=d;best=f;} }); return best; }
function bandCentre(band){ var x=0,y=0,n=0; creatures.forEach(function(c){ if(c.kind==="hom"&&!c.dead&&c.band===band){x+=c.x;y+=c.y;n++;} }); return n?{x:x/n,y:y/n}:null; }
function holding(h, pred){ for (var i=0;i<2;i++) if (h.hold[i] && pred(h.hold[i])) return h.hold[i]; return null; }
function freeHand(h){ return h.hold[0]===null ? 0 : (h.hold[1]===null ? 1 : -1); }
function heldCls(h){ return h.hold[0] ? h.hold[0].cls : "none"; }
function takeItem(h, it, n){
  var def = IT[it.cls], stackMax = def.stack||1;
  for (var i=0;i<2;i++){ var s=h.hold[i]; if (s && s.cls===it.cls && s.count<stackMax && s.cooked===it.cooked && s.dried===it.dried){ var m=Math.min(n||it.count, stackMax-s.count, it.count); s.count+=m; it.count-=m; s.fresh=Math.min(s.fresh,it.fresh); if(it.count<=0) removeItem(it); return true; } }
  var fh = freeHand(h); if (fh<0) return false;
  var take = Math.min(n||it.count, stackMax, it.count);
  if (take>=it.count){ removeItem(it); it.heldBy=h.id; h.hold[fh]=it; }
  else { it.count-=take; var c={}; for (var k in it) c[k]=it[k]; c.id=nid++; c.count=take; c.heldBy=h.id; h.hold[fh]=c; }
  if (h.hold[0]===null && h.hold[1]){ h.hold[0]=h.hold[1]; h.hold[1]=null; }
  return true;
}
function giveNew(h, cls, n, opt){ var it={id:nid++,cls:cls,x:h.x,y:h.y,count:n||1,fresh:1,wet:0,cooked:false,dried:false,fermented:false,covered:false,burn:0,band:-1,storedKey:null,heldBy:null}; if(opt) for(var k in opt) it[k]=opt[k]; items.push(it); if(!takeItem(h,it)){ it.x=h.x+rr(-0.4,0.4); it.y=h.y+rr(-0.4,0.4); } }
function dropHeld(h, slot, x, y){ var it=h.hold[slot]; if(!it) return null; h.hold[slot]=null; if (slot===0 && h.hold[1]){ h.hold[0]=h.hold[1]; h.hold[1]=null; } it.heldBy=null; it.x=(x===undefined?h.x:x)+rr(-0.25,0.25); it.y=(y===undefined?h.y:y)+rr(-0.25,0.25);
  var merge=null; items.forEach(function(o){ if(!merge && o.cls===it.cls && !o.heldBy && dist(o,it)<0.5 && o.cooked===it.cooked && o.dried===it.dried && o.count<(IT[it.cls].stack||1)*3) merge=o; });
  if (merge && IT[it.cls].stack){ merge.count+=it.count; merge.fresh=Math.min(merge.fresh,it.fresh); return merge; }
  items.push(it); return it; }
function consumeHeld(h, slot, n){ var it=h.hold[slot]; it.count-=(n||1); if (it.count<=0){ h.hold[slot]=null; if(slot===0&&h.hold[1]){h.hold[0]=h.hold[1];h.hold[1]=null;} } }

/* ================= verbs: rules from properties ================= */
// target descriptor: {k:"item"|"source"|"hom"|"animal"|"fire"|"water"|"ground"|"self", ref, x, y}
function tgtName(t){
  if (t.k==="item") return IT[t.ref.cls].n + (t.ref.count>1?" ("+t.ref.count+")":"") + (t.ref.cooked?", cooked":"") + (t.ref.covered?", covered":"");
  if (t.k==="source") return ({bush:"berry bush",nutTree:"nut tree",figTree:"fig tree",tree:"tree",mound:"termite mound",burrow:"burrow",vine:"gourd vine",outcrop:"rock outcrop",roots:"wild roots"})[t.ref.type];
  if (t.k==="hom") return t.ref.name + (t.ref.band!==PLAYER_BAND?" (robust)":"");
  if (t.k==="animal") return t.ref.kind;
  if (t.k==="fire") return "fire"; if (t.k==="water") return "water"; if (t.k==="self") return "yourself"; return "here";
}
function tgtCls(t){ if (t.k==="item") return t.ref.cls; if (t.k==="source") return t.ref.type; if (t.k==="animal") return t.ref.kind; if (t.k==="hom") return "hominin"; return t.k; }

function options(h, t){
  var o = [], held = h.hold[0], hd = held?IT[held.cls]:null, hn = held?IT[held.cls].n:"";
  function add(v,label){ o.push({v:v,label:label}); }
  if (t.k==="ground"){ add("move","Walk here"); if (held){ add("place","Put down "+hn+" here"); } if (held && hd.burning) add("place","Touch the burning stick to the ground"); }
  if (t.k==="water"){ add("drink","Drink"); add("fish", held&&hd.pointed?"Spear a fish with the "+hn:"Try to grab a fish"); if (held&&hd.hollow&&!hd.water) add("fill","Fill the gourd"); if (held) add("place","Drop "+hn+" in the water"); add("move","Wade here"); }
  if (t.k==="self"){ if (held && hd.food) add("eat","Eat the "+hn); if (held && hd.water) add("drinkGourd","Drink from the gourd"); if (held && hd.warm) add("wear","Wear the hide"); if (h.wear) add("unwear","Take off the hide"); if (held) add("drop","Drop "+hn); if (h.hold[1]) add("swap","Swap hands"); }
  if (t.k==="item"){
    var it=t.ref, d=IT[it.cls];
    add("pick","Pick up "+d.n);
    if (d.food && !d.shell) add("eat","Eat the "+d.n+" here");
    if (held){
      add("strike","Hit the "+d.n+" with the "+hn);
      if (hd.sharp) add("cut","Cut the "+d.n+" with the "+hn);
      add("place","Put the "+hn+" on the "+d.n);
      if (hd.long) add("probe","Poke the "+d.n+" with the "+hn);
    }
  }
  if (t.k==="source"){
    var s=t.ref, ty=s.type;
    if (ty==="bush") add("gather","Pick berries ("+s.stock+")");
    if (ty==="figTree") add("gather","Pick figs ("+s.stock+")");
    if (ty==="nutTree") add("gather","Gather fallen nuts");
    if (ty==="vine") add("gather","Pick a gourd ("+s.stock+")");
    if (ty==="outcrop") add("gather","Pick up a stone");
    if (s.tree||ty==="bush"){ add("breakStick","Break off a stick"); add("leaves","Strip leaves"); }
    if (s.tree) add("climb", h.inTree===s?"Climb down":"Climb the tree");
    if (ty==="mound"){ add("dig","Dig into the mound by hand"); if (held) add("probe","Poke the "+hn+" into the mound"); }
    if (ty==="roots"){ add("dig","Dig up roots by hand ("+Math.floor(s.stock)+")"); if (held) add("probe","Dig with the "+hn); }
    if (ty==="burrow"){ add("dig","Dig at the burrow"); if (held) add("probe","Poke the "+hn+" into the burrow"); }
    if (held) add("strike","Hit the "+tgtName(t)+" with the "+hn);
    if (held) add("place","Put the "+hn+" by the "+tgtName(t));
  }
  if (t.k==="fire"){ if (held) add("place","Put the "+hn+" in the fire"); add("takeFire","Pull out a burning stick"); add("warm","Sit by the fire"); }
  if (t.k==="animal"){ var a=t.ref; if (held) add("throw","Throw the "+hn+" at the "+a.kind); add("attack", held?"Attack with the "+hn:"Attack with bare hands"); add("threaten","Threaten and display"); add("move","Approach"); }
  if (t.k==="hom"){
    var oh=t.ref;
    if (oh.band===PLAYER_BAND) add("focus","Take control of "+oh.name);
    add("groom","Groom "+oh.name);
    if (held && hd.food) add("share","Share the "+hn);
    if (held) add("give","Hand over the "+hn);
    if (oh.band===PLAYER_BAND){ add("lead","Lead: make "+oh.name+" follow you"); add("copy","Show "+oh.name+" what you do next"); }
    add("threaten","Threaten "+oh.name); add("attack","Attack "+oh.name);
    if (held) add("throw","Throw the "+hn+" at "+oh.name);
  }
  return o;
}

function stillValid(t){ if (!t) return false; if (t.k==="item") return items.indexOf(t.ref)>=0; if (t.k==="hom"||t.k==="animal") return !t.ref.dead; if (t.k==="fire") return fires.indexOf(t.ref)>=0; return true; }
function tpos(t){ return (t.k==="item"||t.k==="source"||t.k==="hom"||t.k==="animal"||t.k==="fire") ? {x:t.ref.x,y:t.ref.y} : {x:t.x,y:t.y}; }

function hurt(c, amt, by){ c.hp -= amt; if (c.kind==="hom"){ c.fear=Math.min(1,c.fear+0.4); if (by && by.kind==="hom") c.anger[by.id]=Math.min(1,(c.anger[by.id]||0)+0.6); } if (c.hp<=0) kill(c, by); }
function kill(c, by){
  if (c.dead) return; c.dead = true;
  if (c.kind==="hom"){
    var cause = by ? (by.kind==="hom" ? "killed by "+by.name : "killed by a "+by.kind) : (c.hunger>=1?"starved":(c.thirst>=1?"died of thirst":(c.sick>0.6?"died of sickness":"died")));
    logE(c.name+" ("+(c.band===PLAYER_BAND?"yours":"robust")+") "+cause+".", "death");
    c.hold.forEach(function(s,i){ if(s) dropHeld(c,0); });
    if (c===focus){ focus=null; updateCard(); toast(c.name+" is dead. Tap another of your band to take control."); }
    creatures.forEach(function(o){ if (o.kind==="hom" && !o.dead && (o.bonds[c.id]||0)>0.5){ o.fear=Math.min(1,o.fear+0.3); } });
  } else if (c.kind==="antelope"){ addItem("carcass", c.x, c.y, 1, {meat:6, bones:2, hides:1}); logE("An antelope was brought down"+(by&&by.kind==="hom"?" by "+by.name+"'s group":"")+".", "disc"); }
  else if (c.kind==="hyena"||c.kind==="leopard"){ logE("A "+c.kind+" was killed"+(by&&by.kind==="hom"?" by "+by.name:"")+".", "disc"); addItem("carcass", c.x, c.y, 1, {meat:3, bones:2, hides:1}); }
}

function doVerb(h, verb, t, forced){
  var held=h.hold[0], hd=held?IT[held.cls]:null, hc=held?held.cls:"none", tc=tgtCls(t), p=tpos(t);
  var res = {effect:null, payoff:0, msg:null};
  var s = 0.3 + sk(h,verb)*0.7;
  switch(verb){
  case "move": return res;
  case "pick":
    if (!takeItem(h, t.ref)){ res.msg="Hands are full."; return res; }
    var picked=h.hold[0];
    if (t.ref.storedBy!==undefined && t.ref.band!==-1 && t.ref.band!==h.band){ res.effect="steal"; }
    if (picked && picked.band===h.band && picked.storer && picked.storer!==h.id){ var st=creatures.find(function(c){return c.id===picked.storer;}); if (st && !st.dead && dist(st,h)<9){ st.anger[h.id]=Math.min(1,(st.anger[h.id]||0)+0.5); res.msg=st.name+" saw that."; } }
    return res;
  case "gather":
    var sr=t.ref;
    if (sr.type==="nutTree"){ var fallen = nearestItem(h,function(i){return i.cls==="nut";},3); if (fallen){ takeItem(h,fallen); } else { res.msg="No nuts on the ground. The tree has "+sr.stock+" up high."; } return res; }
    if (sr.type==="outcrop"){ giveNew(h,"stone",1); return res; }
    if (sr.stock<=0){ res.msg="Nothing left to pick."; return res; }
    var cls = sr.type==="bush"?"berry":(sr.type==="figTree"?"fig":"gourd"); var n = Math.min(sr.stock, sr.type==="vine"?1:2+Math.floor(s*2));
    sr.stock-=n; giveNew(h, cls, n); return res;
  case "breakStick": var srt=t.ref; if (srt.type==="bush" || (srt.stock||0)>0 || rnd()<0.5){ if(srt.tree) srt.stock=Math.max(0,(srt.stock||0)-1); giveNew(h,"stick",1); } else res.msg="No good branches left."; return res;
  case "leaves": giveNew(h,"leaves",2); return res;
  case "climb":
    if (h.inTree===t.ref){ h.inTree=null; return res; } h.inTree=t.ref; h.x=t.ref.x; h.y=t.ref.y;
    if (isNight()){ res.effect="climbSleep"; res.payoff=0.5; h.asleep=true; }
    else if (h.fear>0.4){ res.effect="climbFlee"; res.payoff=0.5; }
    return res;
  case "eat":
    var food = t.k==="self" ? held : t.ref; if (!food){ return res; }
    var fd = IT[food.cls];
    if (fd.shell && h.genes.bite<0.75){ hurt(h,0.03); res.msg="The shell is too hard to bite."; res.effect="biteFail"; return res; }
    var cal = fd.cal*(food.cooked?1.5:1)*(food.fermented?0.8:1)*(0.4+food.fresh*0.6);
    h.hunger = Math.max(0, h.hunger - cal/100);
    if (food.storer!==undefined && food.storedKey && patterns[food.storedKey]){ patterns[food.storedKey].payoff += (h.hunger>0.4?cal/12:cal/40); }
    if (fd.toxic && !food.cooked){ if (rnd() < fd.toxic*(1-h.genes.detox*0.6)){ h.sick=Math.min(1,h.sick+0.55); res.effect="sick"; logE(h.name+" became sick after eating "+fd.n+".", "death");
        creatures.forEach(function(o){ if(o.kind==="hom"&&!o.dead&&dist(o,h)<8){ o.aversion[food.cls]=Math.min(1,(o.aversion[food.cls]||0)+(o===h?0.7:0.35)*(stage(o)==="juvenile"?1.5:1)); } });
        checkAvoid(food.cls); } }
    if (food.fresh<0.25 && !food.dried && !food.cooked){ if (rnd()<0.5){ h.sick=Math.min(1,h.sick+0.25); res.msg=h.name+" ate rotten food and feels ill."; } }
    if (food.fermented){ h.drunk=Math.min(1,h.drunk+0.5); res.effect="drunk"; res.msg=h.name+" is unsteady after the fermented fruit."; }
    if (t.k==="self") consumeHeld(h,0,1); else { food.count--; if (food.count<=0) removeItem(food); }
    return res;
  case "drink":
    h.thirst=Math.max(0,h.thirst-0.5);
    if (T(h.x,h.y)===SHALLOW || T(h.x,h.y)===DEEP){ creatures.forEach(function(c){ if(c.kind==="croc"&&!c.dead&&dist(c,h)<4&&c.cool<=0&&rnd()<0.12){ c.cool=8; hurt(h,0.6,c); res.msg="A crocodile lunged from the water!"; } }); }
    return res;
  case "drinkGourd": if (held && hd.water){ h.thirst=Math.max(0,h.thirst-0.45); held.water=(held.water===undefined?hd.water:held.water)-1; if (held.water<=0){ held.cls="gourd"; delete held.water; } res.effect="drinkGourd"; res.payoff = nearWater(h.x,h.y,4)?0.1:1.2; } return res;
  case "fill": if (held && hd.hollow){ held.cls="gourdW"; held.water=3; res.effect="fill"; res.payoff=0.4; } return res;
  case "fish":
    var pointed = held && hd.pointed, chance = (pointed?0.32:0.08)*(0.5+s) * (T(p.x,p.y)===SHALLOW?1:0.6);
    if (rnd()<chance){ giveNew(h,"fish",1); res.payoff=2.2; res.effect = pointed?"spearFish":"grabFish"; } else res.msg="Missed.";
    creatures.forEach(function(c){ if(c.kind==="croc"&&!c.dead&&dist(c,h)<5&&c.cool<=0&&rnd()<0.12){ c.cool=8; hurt(h,0.5,c); res.msg="A crocodile attacked!"; } });
    return res;
  case "dig":
    if (t.ref.type==="roots"){ if (t.ref.stock>=1 && rnd()<0.38+s*0.2){ t.ref.stock--; giveNew(h,"tuber",1); res.effect="digRoots"; res.payoff=0.6; } else res.msg="The ground is hard. Nothing yet."; return res; }
    if (t.ref.type==="mound"){ if (rnd()<0.25 && t.ref.stock>0){ t.ref.stock--; h.hunger=Math.max(0,h.hunger-0.05); res.effect="dig"; res.payoff=0.3; } else { hurt(h,0.02); res.msg="Bitten by soldier termites."; } }
    else { if (t.ref.rodents>0 && rnd()<0.12+s*0.1){ t.ref.rodents--; giveNew(h,"rodent",1); res.effect="digRodent"; res.payoff=1.2; } else res.msg="It escaped deeper."; }
    return res;
  case "probe":
    if (!held){ return res; }
    if (t.k==="source" && t.ref.type==="mound" && hd.long){ if (t.ref.stock>0 && rnd()<0.45+s*0.4){ var g=1+Math.floor(s*2); t.ref.stock-=g; h.hunger=Math.max(0,h.hunger-0.05*g); res.effect="termites"; res.payoff=0.5*g; } else res.msg="Nothing came out on the stick."; return res; }
    if (t.k==="source" && t.ref.type==="roots" && hd.long){ if (t.ref.stock>=1 && rnd()<0.5+s*0.35+(hd.pointed?0.1:0)){ t.ref.stock--; giveNew(h,"tuber",1); res.effect="digStick"; res.payoff=1.2; } else res.msg="Prising at the soil."; return res; }
    if (t.k==="source" && t.ref.type==="burrow" && hd.long){ if (t.ref.rodents>0 && rnd()<0.2+s*0.3+(hd.pointed?0.15:0)){ t.ref.rodents--; giveNew(h,"rodent",1); res.effect="rodentProbe"; res.payoff=1.4; } else res.msg="Something scrabbled away inside."; return res; }
    if (t.k==="item" && IT[t.ref.cls].carcass && hd.long){ res.msg="Poking it does little."; return res; }
    res.msg="Nothing happens."; return res;
  case "strike":
    if (!held) return res;
    if (t.k==="item"){
      var ti=t.ref, td=IT[ti.cls];
      if (td.shell && (hd.hard||0)>=td.shell){ if (rnd()<0.55+s*0.4){ ti.count--; if(ti.count<=0) removeItem(ti); addItem("kernel",ti.x+rr(-0.2,0.2),ti.y+rr(-0.2,0.2),1); res.effect="crack"; res.payoff=1.6; } else { res.msg="Glanced off the shell."; if(rnd()<0.1) hurt(h,0.03); } return res; }

/* ================= pathfinding (BFS on tiles) ================= */
var bfsPrev = new Int32Array(W*H), bfsMark = new Int32Array(W*H), bfsStamp = 0, bfsQ = new Int32Array(W*H);
function findPath(sx, sy, tx, ty, near){
  sx=Math.floor(sx); sy=Math.floor(sy); tx=Math.floor(tx); ty=Math.floor(ty);
  bfsStamp++; var head=0, tail=0, s0=sy*W+sx; bfsQ[tail++]=s0; bfsMark[s0]=bfsStamp; bfsPrev[s0]=-1; var found=-1;
  while (head<tail){
    var c=bfsQ[head++], cx=c%W, cy=(c-cx)/W;
    if (Math.abs(cx-tx)<=near && Math.abs(cy-ty)<=near){ found=c; break; }
    for (var k=0;k<4;k++){ var nx=cx+(k===0?1:k===1?-1:0), ny=cy+(k===2?1:k===3?-1:0); if (nx<0||ny<0||nx>=W||ny>=H) continue; var n=ny*W+nx; if (bfsMark[n]===bfsStamp) continue; var t=tiles[n]; if (t===DEEP||t===ROCK) continue; bfsMark[n]=bfsStamp; bfsPrev[n]=c; bfsQ[tail++]=n; }
  }
  if (found<0) return null;
  var path=[]; for (var q=found; q!==-1 && q!==s0; q=bfsPrev[q]) path.push({x:q%W+0.5, y:Math.floor(q/W)+0.5});
  path.reverse(); var out=[]; for (var i=0;i<path.length;i++) if (i%2===1 || i===path.length-1) out.push(path[i]); return out;
}

/* ================= tasks and movement ================= */
function setTask(h, verb, t, src, extra){ h.task={verb:verb,t:t,src:src,interest:(src==="player"?999:(20+h.genes.attention*25)),started:time,prog:0}; if (extra) for (var k in extra) h.task[k]=extra[k]; if (h.inTree && verb!=="climb") { h.inTree=null; } h.asleep=false; }

var ACT_TIME = {gather:1.2,eat:0.8,drink:1.2,strike:1.1,cut:1.4,probe:1.5,dig:1.8,fish:1.6,place:0.5,pick:0.4,breakStick:1.2,leaves:0.8,climb:1,groom:2.5,share:0.5,give:0.4,throw:0.4,attack:0.6,threaten:0.8,takeFire:1,warm:3,fill:1,drinkGourd:0.8,wear:1,unwear:0.6,drop:0.2,swap:0.1,lead:0.6,copy:0.4,focus:0,move:0};
function reach(verb){ return ({throw:9,threaten:3.5,attack:1.1,move:0.4,fish:1.6,drink:1.5,fill:1.5})[verb] || 1.1; }

function stepTask(h, dt){

  var p=tpos(tk.t), d=Math.hypot(p.x-h.x,p.y-h.y), r=reach(tk.verb);

  if (d>r){
    if (d>2.5){
      if (!tk.path || (tk.t.k==="hom"||tk.t.k==="animal") && (!tk.pathT || Math.hypot(tk.pathT.x-p.x,tk.pathT.y-p.y)>3)){
        if (time - (tk.lastPath||-9) > 0.5){ tk.lastPath=time; tk.path=findPath(h.x,h.y,p.x,p.y,(tk.t.k==="water"||tk.t.k==="source")?1:0); tk.pathT={x:p.x,y:p.y};
          if (!tk.path){ if (tk.t.ref) { h.bad=h.bad||{}; h.bad[tk.t.ref.id]=time+DAY*0.5; } if (h===focus) h.thought="Can't find a way there."; h.task=null; return; } }

  var held=h.hold[0], hc=held?held.cls:"none", tc=tgtCls(tk.t);

  else { tk.prog=0; if (tk.verb==="gather" && tk.t.k==="source" && tk.t.ref.stock<=0) h.task=null; if (freeHand(h)<0 && ["gather","breakStick","leaves"].indexOf(tk.verb)>=0 && !(h.hold[0]&&h.hold[0].count<(IT[h.hold[0].cls].stack||1))) h.task=null; if (["strike","cut"].indexOf(tk.verb)>=0 && !stillValid(tk.t)) h.task=null; }

function focusUpdate(h, dt){

    if (conflict){

      var hc=held?held.cls:"none", r = effRes(h, tk.verb, hc, tgtCls(tk.t));

      if (rnd() < pr){

        else if (pv==="flee"){ var th=nearestThreat(h,10); if (th) setTask(h,"move",{k:"ground",x:clamp(h.x+(h.x-th.x)*2,1,W-1),y:clamp(h.y+(h.y-th.y)*2,1,H-1)},"drive"); h.thought=h.name+" panicked and ran!"; toast(h.thought); return; }

        else if (pv==="sleep"){ h.task=null; h.asleep=true; h.thought=h.name+" fell asleep."; toast(h.thought); return; }
      }
    }
    var social = homs().find(function(o){ return o!==h && o.band===h.band && dist(o,h)<2 && o.task && o.task.verb==="threaten" && o.task.t.ref===h; });
    if (social && rnd()<dt*0.5){ h.thought=social.name+" is challenging "+h.name+"!"; }
    stepTask(h, dt); return;
  }
  h.boredom = Math.min(1, h.boredom + dt/DAY*2);
  if (h.boredom>0.75 || urgent(h)>0.8){
    if (time - h.lastThink > 1){ h.lastThink=time; var best=think(h); if (best && best.verb!=="sleep" && best.verb!=="mate" && best.u>0.5){ setTask(h,best.verb,best.t,best.src); h.thought=h.name+" decided to "+best.label.toLowerCase()+"."; } else if (best && best.verb==="sleep"){ h.asleep=true; h.thought=h.name+" dozed off."; } }

}

/* ================= world update ================= */
function worldUpdate(dt){
  var dd=dt/DAY, season=seasonOf();
  if (rnd()<dt*(season==="wet"?0.004:0.0012)) { raining=true; rainT=rr(15,50); }
  if (raining){ rainT-=dt; if (rainT<=0) raining=false; }
  sources.forEach(function(s){
    var grow = s.regrow*dd;
    if (s.type==="bush" && season==="wet") s.stock=Math.min(s.max, s.stock+grow);
    else if (s.type==="bush") s.stock=Math.min(s.max*0.5, s.stock+grow*0.35);
    if (s.type==="figTree"){ s.stock=Math.min(s.max,s.stock+grow*0.8); if (s.stock>=s.max-0.5 && rnd()<dt*0.02){ s.stock--; addItem("fig",s.x+rr(-1.5,1.5),s.y+rr(-1.5,1.5),1,{fresh:0.7}); } }
    if (s.type==="nutTree" && season==="dry"){ s.stock=Math.min(s.max,s.stock+grow); if (s.stock>4 && rnd()<dt*0.015){ s.stock--; addItem("nut",s.x+rr(-1.5,1.5),s.y+rr(-1.5,1.5),1); } }
    if (s.type==="tree") s.stock=Math.min(s.max,s.stock+grow*0.3);
    if (s.type==="mound") s.stock=Math.min(s.max,s.stock+grow);
    if (s.type==="vine"||s.type==="roots") s.stock=Math.min(s.max,s.stock+grow);
    if (s.type==="burrow") s.rodents=Math.min(2,(s.rodents||0)+dd*0.6);
    s.stock = Math.floor(s.stock*100)/100;
  });
  if (raining && rnd()<dt*0.05){ var p=randomTile(function(t){return t===WOOD;},50); if(p) addItem(rnd()<0.35?"mushR":"mushB",p.x+rr(-0.4,0.4),p.y+rr(-0.4,0.4),1+Math.floor(rnd()*2)); }
  for (var i=items.length-1;i>=0;i--){
    var it=items[i], d=IT[it.cls];
    if (raining && !it.covered && T(it.x,it.y)!==ROCK) it.wet=Math.min(1,it.wet+dt*0.05); else it.wet=Math.max(0,it.wet-dt*0.01);
    if (d.perish){ var rate=d.perish*dd*(it.cooked?0.4:1)*(it.dried?0.1:1)*(1+it.wet*1.5)*(seasonOf()==="dry"?0.9:1.1); it.fresh-=rate; }
    if (it.drying){ it.dryT=(it.dryT||0)+dd; if (it.dryT>1 && !it.wet){ it.dried=true; it.drying=false; logE("Some "+d.n+" left on hot ground dried out and stopped rotting.", "disc"); } }
    if (d.ferment && it.fresh<0.45 && it.fresh>0.15 && !it.fermented){ it.fermented=true; }
    if (d.food && !it.covered && it.band>=0 && rnd()<dt*0.004){ it.count--; if (it.count<=0){ items.splice(i,1); continue; } }
    if (it.fresh<=0){ if (it.storedKey && patterns[it.storedKey]) patterns[it.storedKey].payoff-=0.5; items.splice(i,1); continue; }
    if (it.cls==="carcass" && it.fresh<=0.01) items.splice(i,1);
  }

  for (var f=fires.length-1;f>=0;f--){ var fr=fires[f]; fr.fuel-=dd*(raining?6:1.8); if (fr.fuel<=0){ fires.splice(f,1); continue; } items.forEach(function(it){ if (!it.heldBy && dist(it,fr)<0.7 && IT[it.cls].food && IT[it.cls].cook && !it.cooked){ it.cookT=(it.cookT||0)+dd; if (it.cookT>0.05){ it.cooked=true; it.fresh=1; } } }); }

  if (rnd()<dt*lightningChance){ var lt=randomTile(function(t,x,y){ return t===GRASS && dryness[Math.floor(y)*W+Math.floor(x)]>0.6; },100); if (lt){ fireT[Math.floor(lt.y)*W+Math.floor(lt.x)]=1; logE("Lightning set the grass alight.", "death"); } }

var dirtyTiles = [];
function fireStep(){
  var season=seasonOf();
  for (var i=0;i<W*H;i++){
    var t=tiles[i];
    if (t===GRASS||t===WOOD) dryness[i]=clamp(dryness[i] + (season==="dry"?0.004:-0.01) - (raining?0.03:0), 0, 1);
    if (t===BURNT){ burntT[i]+=0.004*(season==="wet"?3:1); if (burntT[i]>1){ tiles[i]=GRASS; burntT[i]=0; dryness[i]=0; dirtyTiles.push(i); } }
  }
  var burning=[]; for (i=0;i<W*H;i++) if (fireT[i]>0) burning.push(i);
  burning.forEach(function(i){
    fireT[i]-= raining?0.6:0.12;
    var x=i%W, y=Math.floor(i/W);
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){ var nx=x+d[0], ny=y+d[1]; if (nx<0||ny<0||nx>=W||ny>=H) return; var j=ny*W+nx, tt=tiles[j]; if ((tt===GRASS||tt===WOOD) && fireT[j]<=0 && dryness[j]>0.35 && rnd()<dryness[j]*0.55 && !raining) fireT[j]=1; });
    if (fireT[i]<=0){ fireT[i]=0; tiles[i]=BURNT; burntT[i]=0; dryness[i]=0; dirtyTiles.push(i);
      if (rnd()<0.08) addFire(x+0.5,y+0.5,0.35);
      creatures.forEach(function(c){ if (!c.dead && Math.floor(c.x)===x && Math.floor(c.y)===y){ if (c.kind==="hom"){ hurt(c,0.35); c.fear=1; } else if (c.kind==="antelope"||c.kind==="hyena"){ hurt(c,0.5); } } });
      items.forEach(function(it){ if (Math.floor(it.x)===x && Math.floor(it.y)===y){ if (IT[it.cls].cook){ it.cooked=true; } else if (IT[it.cls].fuel && !it.heldBy) it.count=0; } });
      if (rnd()<0.025){ addItem("rodent",x+0.5,y+0.5,1,{cooked:true}); }
      sources.forEach(function(s){ if (Math.floor(s.x)===x && Math.floor(s.y)===y && s.type==="burrow" && s.rodents>0){ s.rodents=0; addItem("rodent",s.x,s.y,1,{cooked:true}); } });
    }
  });
  for (i=items.length-1;i>=0;i--) if (items[i].count<=0) items.splice(i,1);
}
for (var di=0; di<W*H; di++) dryness[di]=0.1;

/* ================= projectiles ================= */
function projUpdate(dt){
  for (var i=projectiles.length-1;i>=0;i--){
    var p=projectiles[i]; p.t+=dt*3; var d=Math.hypot(p.tx-p.x,p.ty-p.y);
    if (p.t>=1){
      var it=p.item; it.heldBy=null; it.x=p.tx; it.y=p.ty; if (!isWater(it.x,it.y)) items.push(it);
      if (p.hitT && stillValid(p.hitT)){
        var tgt=p.hitT.ref, d2=IT[it.cls], dmg=0.12*(d2.mass||0.3)*3*(d2.pointed?(it.hard?2.4:1.8):1)*(0.7+p.from.genes.strength*0.6);
        if (p.hitT.k==="animal"){ hurt(tgt,dmg/(tgt.kind==="antelope"?0.8:1.5),p.from); tgt.lastHitBy=p.from; if (tgt.kind==="hyena"||tgt.kind==="leopard"){ tgt.state="flee"; tgt.t=0; tgt.bold=Math.max(0.1,tgt.bold-(d2.burning?0.15:0.05)); } if (d2.burning && it.burn>0){ var tx=Math.floor(it.x), ty=Math.floor(it.y); if (dryness[ty*W+tx]>0.4) fireT[ty*W+tx]=1; } }
        if (p.hitT.k==="hom"){ hurt(tgt,dmg*0.7,p.from); }
      }
      projectiles.splice(i,1);
    }
  }
}

/* ================= main update ================= */
var focus = null, follow = true, speed = 1;
function update(dt){
  time += dt;
  worldUpdate(dt);
  for (var i=0;i<creatures.length;i++){ var c=creatures[i]; if (c.dead) continue; if (c.kind==="hom") homUpdate(c,dt); else animalUpdate(c,dt); }
  projUpdate(dt);
  if (Math.floor(time*10)%50===0) creatures = creatures.filter(function(c){ return !c.dead || (time - (c.deadT||(c.deadT=time)))<1; });
  if (homs().filter(function(c){return c.band===PLAYER_BAND;}).length===0 && !update.over){ update.over=true; logE("Your band is extinct.", "death"); toast("Your band is extinct. Reload the page for a new world."); }
}

function hitTest(wx, wy){
  var best=null, bd=0.9/Math.max(0.6,cam.z)+0.35;
  creatures.forEach(function(c){ if (c.dead) return; var d=Math.hypot(c.x-wx,(c.y-(c.inTree?0.2:0))-wy); if (d<bd){ bd=d; best=c.kind==="hom"?{k:"hom",ref:c}:{k:"animal",ref:c}; } });
  if (best) return best;
  bd=0.55; fires.forEach(function(f){ var d=Math.hypot(f.x-wx,f.y-wy); if (d<bd){bd=d;best={k:"fire",ref:f};} }); if (best) return best;
  bd=0.5; items.forEach(function(it){ if (it.heldBy) return; var d=Math.hypot(it.x-wx,it.y-wy); if (d<bd){bd=d;best={k:"item",ref:it};} }); if (best) return best;

      html+='<div class="entry"><b>'+escapeHTML(p.name)+'</b><br><span class="t">Done '+p.count+' times. Habit in '+habit+' of your band. Average resistance '+Math.round(avg*100)+'%.'+(p.bands[1]?' Robust group knows it too.':'')+' Payoff '+(p.payoff>0?'+':'')+p.payoff.toFixed(1)+'</span></div>'; });
    var cand=Object.keys(patterns).map(function(k){return patterns[k];}).filter(function(p){return !p.recognized && p.count>0;});
    if (cand.length){ html+='<div class="entry t">Emerging: '+cand.map(function(p){return escapeHTML(patName(p))+' ('+p.count+')';}).join(", ")+'</div>'; } }
  if (sideMode==="help"){ html='<h3>How to play</h3><div class="help"><p>Tap a gold-ringed hominin to take control. Tap the ground to walk, tap anything else to see what you can try with it. Tap your hominin to eat, drink, drop or wear what they hold.</p><p>Nothing is scripted. Every object has physical properties, and anything those properties allow can be tried. Your hominin still has instincts: if they are hungry and holding food, they may eat it instead of doing what you asked. The more often someone does something against instinct, the easier it gets, and anyone watching learns a little too.</p><p>Do something unusual three or more times and the game will recognise it as a behaviour. Others in the band may then start doing it on their own.</p><p>You can only steer one individual at a time. Others will help briefly if you lead them or show them, then get bored. The world reacts: food rots, rain soaks, rivals steal, predators learn, seasons turn, and fire spreads.</p><p>Drag to pan, pinch or scroll to zoom.</p></div>'; }
  side.innerHTML=html;
}
function escapeHTML(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function toggleSide(m){ sideMode = sideMode===m ? null : m; ["bLog","bBeh","bHelp"].forEach(function(id){ document.getElementById(id).classList.remove("on"); }); if (sideMode) document.getElementById({log:"bLog",beh:"bBeh",help:"bHelp"}[sideMode]).classList.add("on"); renderSide(); }
document.getElementById("bLog").addEventListener("click", function(){ toggleSide("log"); });
document.getElementById("bBeh").addEventListener("click", function(){ toggleSide("beh"); });
document.getElementById("bHelp").addEventListener("click", function(){ toggleSide("help"); });

/* ================= loop ================= */
var last=performance.now(), uiT=0;
function frame(now){
  var dt=Math.min(0.1,(now-last)/1000); last=now;
  var steps=Math.max(0,speed);
  for (var i=0;i<steps;i++) update(dt);
  if (follow && focus){ cam.x+=(focus.x-cam.x)*0.12; cam.y+=(focus.y-cam.y)*0.12; }
  render();
  uiT+=dt; if (uiT>0.25){ uiT=0; updateCard(); var d=Math.floor(day())+1, hr=Math.floor(hourOf()); document.getElementById("clock").textContent="DAY "+d; document.getElementById("season").textContent=(seasonOf()==="wet"?"Wet season":"Dry season")+", "+(hr<10?"0":"")+hr+":00"+(raining?", raining":"")+(isNight()?", night":""); if (sideMode==="beh" && Math.random()<0.1) renderSide(); }
  requestAnimationFrame(frame);
}
time = DAY*0.3;
logE("Your band wakes by the lake. Ten individuals, no tools, no traditions.", "");
toggleSide("help");
requestAnimationFrame(frame);
window.__sim = {update:update, homs:homs, patterns:patterns, items:items, creatures:function(){return creatures;}, setFocus:setFocus, setTask:setTask, doVerb:doVerb, options:options, chronicle:chronicle, fires:fires, sources:sources, IT:IT, T:T, getFocus:function(){return focus;}, tap:tap, hitTest:hitTest, nearWater:nearWater};
})();
</script>
