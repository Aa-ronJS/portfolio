# Instagram audience engine — horizontal configuration.
# Markets are test cells: the engine produces for every market listed here
# whose `active` flag is true. Kill a market by flipping the flag; scale one
# by raising posts_per_day. Nothing else in the pipeline is market-specific.

engine:
  model: claude-opus-5          # content generation model
  posts_per_day: 1              # per active market
  video:
    width: 1080
    height: 1920
    fps: 30
    seconds_per_beat: 3.2       # slide duration before audio fitting
  thresholds:                   # kill/scale rules used by the weekly report
    kill_after_posts: 8         # judge a format only after this many attempts
    follows_per_reach_scale: 0.006   # >= 0.6% of reached accounts follow -> scale
    follows_per_reach_kill: 0.001    # <= 0.1% after kill_after_posts -> kill
    share_rate_scale: 0.01      # shares/reach >= 1% -> scale regardless

# Provider adapters. Each activates when its key is present in the environment
# and degrades to a fallback when it is not, so the pipeline always completes.
providers:
  text:
    env_key: ANTHROPIC_API_KEY      # falls back to offline templates
  image:
    kind: replicate                 # black-forest-labs/flux-schnell
    env_key: REPLICATE_API_TOKEN    # falls back to generated gradient slides
  tts:
    kind: elevenlabs
    env_key: ELEVENLABS_API_KEY     # falls back to a silent track
    voice_id: 21m00Tcm4TlvDq8ikWAM  # "Rachel" default; override per market below
  instagram:
    env_key: IG_ACCESS_TOKEN        # + IG_USER_ID_<MARKET KEY>; falls back to
    api_version: v21.0              # rendering only (artifact upload, no publish)

# Seed test cells. Three monetizable horizontals; replace freely — the engine
# only reads key, audience, angle, dm_keyword, and formats.
markets:
  - key: money
    active: true
    audience: "25-40 year olds who earn decently but never feel ahead"
    angle: "uncomfortable personal-finance math, made concrete in AUD/USD"
    dm_keyword: PLAN
    lead_magnet: "the 15-minute money audit template"
    formats:
      - name: brutal_math
        pattern: "Take a common habit, compute its true 10-year cost, end on the reframe"
      - name: myth_kill
        pattern: "State a money belief people repeat, show the number that breaks it"

  - key: aitools
    active: true
    audience: "office workers who suspect AI could halve their workload but don't know where to start"
    angle: "one workflow, before vs after, with the exact tool named"
    dm_keyword: STACK
    lead_magnet: "the 10-workflow AI starter stack"
    formats:
      - name: before_after
        pattern: "Name a task, show the manual way's cost in hours, then the AI way in minutes"
      - name: hidden_feature
        pattern: "A feature of a mainstream tool almost nobody uses, shown step by step"

  - key: health
    active: true
    audience: "desk workers 30+ whose energy crashed and who distrust hustle-bro fitness"
    angle: "minimum effective dose habits, cited plainly, zero shame"
    dm_keyword: RESET
    lead_magnet: "the 2-week energy reset checklist"
    formats:
      - name: mistake_stack
        pattern: "N things they do daily that wreck X, ranked, worst last"
      - name: tiny_protocol
        pattern: "A under-5-minute protocol with the mechanism explained in one line"
