<!doctype html>
<meta charset="utf-8">
<title>Chasem</title>
<script>
/* Chasem: the other half of move.js. Opened hidden, in a frame, by the app at the other address; never by a person.
   On go.chasem.app it takes a painter's data from chasem.app/app/. On chasem.app it gives it to go.chasem.app. It only
   ever talks to those two, and it never deletes anything: the old copy stays where it was. */
(function () {
  'use strict';
  var NEW = 'https://go.chasem.app', OLD = ['https://chasem.app', 'https://www.chasem.app'];
  var KEY = 'qc-app-v1', MARK = 'qc-moved', MARK_IN = 'qc-moved-in';
  var isNew = location.origin === NEW, isOld = OLD.indexOf(location.origin) >= 0;
  if ((!isNew && !isOld) || window.parent === window) return;
  function state() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function worth(s) { return !!(s && ((s.jobs && s.jobs.length) || (s.account && s.account.email) || (s.details && s.details.trading_name))); }
  function dump() { var out = {}, i, k; for (i = 0; i < localStorage.length; i++) { k = localStorage.key(i); if (k && k.indexOf('qc-') === 0 && k !== MARK && k !== MARK_IN) out[k] = localStorage.getItem(k); } return out; }
  function reply(to, m) { window.parent.postMessage(m, to); }
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (e.source !== window.parent || typeof d !== 'object' || !d.chasem) return;
    try {
      if (isNew && OLD.indexOf(e.origin) >= 0 && d.chasem === 'take') {
        // Only into an empty app, or one that is still exactly what the last move put there. Anything he has
        // typed here since is his and is not written over.
        var mine = state(), s = null;
        try { s = JSON.parse(d.keys[KEY]); } catch (x) {}
        if (!worth(s)) return reply(e.origin, { chasem: 'kept' });
        if (worth(mine) && String(mine.saved_at || '') !== localStorage.getItem(MARK_IN)) return reply(e.origin, { chasem: 'kept' });
        localStorage.setItem(KEY, String(d.keys[KEY])); // the jobs first: if they do not fit, this throws and nothing else is written
        for (var k in d.keys) if (Object.prototype.hasOwnProperty.call(d.keys, k) && k.indexOf('qc-') === 0 && k !== KEY) try { localStorage.setItem(k, String(d.keys[k])); } catch (x) {}
        localStorage.setItem(MARK_IN, String(s.saved_at || ''));
        return reply(e.origin, { chasem: 'taken' });
      }
      if (isOld && e.origin === NEW && d.chasem === 'give') {
        var st = state();
        return reply(e.origin, worth(st) ? { chasem: 'here', keys: dump() } : { chasem: 'none' });
      }
      if (isOld && e.origin === NEW && d.chasem === 'got') {
        var s2 = state(); if (s2) localStorage.setItem(MARK, String(s2.saved_at || ''));
        return reply(e.origin, { chasem: 'marked' });
      }
    } catch (x) { reply(e.origin, { chasem: 'failed' }); }
  });
  window.parent.postMessage({ chasem: 'ready' }, '*'); // carries nothing; everything with data in it names its receiver
})();
</script>
