# The movement library, demonstrated end to end on Sugar. Every move is
# a stock clip (pipeline/clips/) playing on the same nine drawings; the
# gun, pan, rope and ladder are props — images riding a bone (actor
# `props:`) or staged as plain image actors. Captions name each move.
#
# Render:   python3 pipeline/render.py demo/episode-moves.yaml

title: sugar does everything
size: [1080, 1920]
fps: 12
boil: 0.0015
boil_every: 2

defaults:
  font: ../fonts/satoshi-var.ttf
  caption_size: 0.042
  caption_weight: 700
  caption_color: [26, 26, 26]
  caption_y: 0.84

shots:
  # 1 — the run: same legs as the walk, twice the rate, runner arms.
  - bg: backgrounds/chipshop.png
    duration: 2.0
    caption: the run
    actors:
      - char: sugar
        at: [1.25, 0.76]
        scale: 0.46
        clip: run
        moves:
          - {type: slide, from: [-0.25, 0.76], to: [1.25, 0.76], t: [0, 1.9]}

  # 2 — the jump: crouch, launch, tuck, land.
  - bg: backgrounds/chipshop.png
    duration: 2.0
    caption: the jump
    actors:
      - char: sugar
        at: [0.5, 0.76]
        scale: 0.46
        clip: {name: jump, t: [0.4, 2.0]}

  # 3 — sitting down (and staying down: the clip holds its last pose).
  - bg: backgrounds/chipshop.png
    duration: 2.6
    caption: sitting down
    actors:
      - char: sugar
        at: [0.45, 0.76]
        scale: 0.46
        clip: {name: sit, t: [0.4, 2.6]}

  # 4 — kneeling (a low crouch until someone draws him a leg_kneel part).
  - bg: backgrounds/chipshop.png
    duration: 2.4
    caption: kneeling, more or less
    actors:
      - char: sugar
        at: [0.45, 0.76]
        scale: 0.46
        clip: {name: kneel, t: [0.4, 2.4]}

  # 5 — skipping rope: little hops, wrists circling, the rope is a
  # two-frame prop cycling in time with the hops.
  - bg: backgrounds/chipshop.png
    duration: 2.6
    caption: skipping rope
    actors:
      - char: sugar
        at: [0.5, 0.76]
        scale: 0.46
        clip: skip
        props:
          # one revolution: over the head, down in FRONT, under the
          # feet, up BEHIND the character (z: behind)
          - imgs:
              - props/rope_top.png
              - props/rope_front.png
              - props/rope_bottom.png
              - {img: props/rope_back.png, z: behind}
            period: 0.5
            bone: root
            at: [0.5, 0.60]
            anchor: [0.5, 0.492]
            size: 0.85

  # 6 — up the ladder: the ladder is a plain image actor behind him,
  # the climb clip cycles hands and knees while a slide lifts him.
  - bg: backgrounds/chipshop.png
    duration: 2.6
    caption: up the ladder
    actors:
      - image: props/ladder.png
        at: [0.55, 0.97]
        scale: 0.82
      - char: sugar
        at: [0.55, 0.44]
        scale: 0.40
        clip: climb
        # his hands actually take the rungs: each reach solves the arm
        # (stretching if needed) so the hand stays ON the rung while
        # the body rises past it
        reach:
          - {bone: arm_l, to: {actor: 0, at: [0.5, 0.434]}, t: [0.2, 0.9]}
          - {bone: arm_r, to: {actor: 0, at: [0.5, 0.316]}, t: [0.7, 1.4]}
          - {bone: arm_l, to: {actor: 0, at: [0.5, 0.199]}, t: [1.0, 1.7]}
          - {bone: arm_r, to: {actor: 0, at: [0.5, 0.081]}, t: [1.5, 2.3]}
        moves:
          - {type: slide, from: [0.55, 0.88], to: [0.55, 0.44], t: [0.2, 2.3]}

  # 7 — a cartwheel: star shape spinning about the hips, travelling
  # left. flip is pinned so the spin direction matches the travel.
  - bg: backgrounds/chipshop.png
    duration: 2.2
    caption: a cartwheel
    actors:
      - char: sugar
        at: [0.30, 0.76]
        scale: 0.44
        flip: false
        clip: {name: cartwheel, t: [0.4, 1.6]}
        moves:
          - {type: slide, from: [0.72, 0.76], to: [0.30, 0.76], t: [0.4, 1.6]}

  # 8 — a backflip, stuck perfectly, tiny backward drift.
  - bg: backgrounds/chipshop.png
    duration: 2.0
    caption: a backflip
    actors:
      - char: sugar
        at: [0.56, 0.76]
        scale: 0.46
        flip: false
        clip: {name: backflip, t: [0.4, 1.4]}
        moves:
          - {type: slide, from: [0.48, 0.76], to: [0.56, 0.76], t: [0.6, 1.2]}

  # 9 — armed, one hand: the aim clip holds the arm out with a
  # breathing sway; the gun rides the hand.
  - bg: backgrounds/chipshop.png
    duration: 2.2
    caption: armed (one hand)
    actors:
      - char: sugar
        at: [0.55, 0.76]
        scale: 0.46
        clip: aim
        props:
          - img: props/gun.png
            bone: arm_l
            at: [0.395, 0.648]
            anchor: [0.78, 0.42]
            size: 0.13
            rot: -90

  # 10 — armed, both hands: same gun, bladed stance, support hand up.
  - bg: backgrounds/chipshop.png
    duration: 2.2
    caption: armed (both hands, serious)
    actors:
      - char: sugar
        at: [0.55, 0.76]
        scale: 0.46
        clip: aim2
        props:
          - img: props/gun.png
            bone: arm_l
            at: [0.395, 0.648]
            anchor: [0.78, 0.42]
            size: 0.13
            rot: -90

  # 11 — frying an egg: bent arm holds the pan (egg included), the
  # clip jiggles it; he watches the egg like it owes him money.
  - bg: backgrounds/chipshop.png
    duration: 3.0
    caption: frying an egg
    actors:
      - char: sugar
        at: [0.5, 0.76]
        scale: 0.46
        clip: fry
        props:
          - img: props/pan.png
            bone: arm_l
            at: [0.52, 0.565]
            anchor: [0.88, 0.5]
            size: 0.115
            rot: -30

  # 12 — the door: he walks up, his hand goes to the handle (reaching
  # and stretching until it touches), the door slides open, he leaves.
  - bg: backgrounds/chipshop.png
    duration: 3.8
    caption: he opens the door by hand
    actors:
      - image: props/door.png
        at: [0.70, 0.62]
        anchor: [0.5, 0.5]
        scale: 0.72
        moves:
          - {type: slide, from: [0.70, 0.62], to: [1.08, 0.62], t: [1.9, 2.4]}
      - char: sugar
        at: [1.30, 0.76]
        scale: 0.46
        clip: {name: walk, t: [0.2, 1.0]}
        reach:
          - {bone: arm_l, to: [0.849, 0.627], t: [1.1, 1.9]}
        moves:
          - {type: slide, from: [0.15, 0.76], to: [0.60, 0.76], t: [0.2, 1.0]}
          - {type: slide, from: [0.60, 0.76], to: [1.30, 0.76], t: [2.5, 3.6]}

  # 13 — gravity: he lets go of the pan and it falls to the floor.
  - bg: backgrounds/chipshop.png
    duration: 2.6
    caption: dropped it
    actors:
      - char: sugar
        at: [0.5, 0.76]
        scale: 0.46
        clip: fry
        props:
          - img: props/pan.png
            bone: arm_l
            at: [0.52, 0.565]
            anchor: [0.88, 0.5]
            size: 0.115
            rot: -30
            drop: {at: 1.1, spin: 300}

  # 14 — attention: whoever talks gets looked at, automatically.
  - bg: backgrounds/chipshop.png
    audio: vo/line2.wav
    caption: he looks at whoever talks
    actors:
      - char: doug
        at: [0.72, 0.76]
        scale: 0.46
        talk: true
        clip: idle
      - char: sugar
        at: [0.28, 0.76]
        scale: 0.46
        clip: idle
