# essay-channel — the channel's brief. Everything the machine decides, it
# decides from this file. Edit it, commit, and the next run follows.

name: Untitled Essays
# The brief the topic picker and script writer work from. Be specific:
# who watches, what they come for, what the channel never does.
niche: >
  Ten-minute explainers on how ordinary things work — the engineering,
  economics and history behind objects and systems people use every day
  without thinking about them. Curious adults; plain language; always
  concrete; never clickbait, never outrage.
language: en
format: landscape          # landscape (1920x1080) or portrait (1080x1920)
target_minutes: 8          # narration length the script aims for
model: claude-opus-5-5     # research, topics and script writing
effort: high

topics:
  queue: []                # titles you want done first, in order; or leave
                           # empty and the channel picks its own from the brief
  avoid: []                # subjects never to pick
  generate: true           # pick a fresh topic when the queue is empty

voice:
  provider: elevenlabs     # elevenlabs | openai
  voice: Rachel            # ElevenLabs voice name or id; for openai: alloy, onyx, nova...
  model: eleven_multilingual_v2
  speed: 1.0

broll:
  provider: pexels         # pexels | pixabay (Pexels needs PEXELS_API_KEY)
  clip_seconds: 7          # cut to a new clip about this often
  min_clip_seconds: 4

music:
  folder: music            # drop royalty-free tracks here (YouTube Audio Library is safe)
  jamendo: false           # true: also search Jamendo's CC catalogue (needs JAMENDO_CLIENT_ID)
  gain_db: -16             # music level under the voice
  duck_db: -10             # extra reduction while the voice is speaking

quality:
  passes: 2                # critique-and-revise rounds on every script
  searches: 12             # web searches the research turn may make
  follow_up_research: true # the outline's gaps go back to the researcher
  vision_pick: true        # Claude looks at candidate frames and picks each shot
  review: true             # Claude watches the finished cut before upload
  min_score: 3.5           # hold for a person when any review score is below this (0 = never)
  pronunciation_check: auto  # auto | on | off — needs faster-whisper; names the
                           # voice mangles are respelled and re-recorded

look:
  accent: "F5C542"         # callouts and the thumbnail bar, hex RGB
  captions: auto           # auto (burn on portrait, upload a track on landscape) | burn | upload | both | none
  title_card: true         # the title over the first shot, fading up from black
  end_card: true           # channel name + "Sources in the description" at the end
  end_card_text: ""        # defaults to the channel name
  lower_thirds: true       # each section's heading for a few seconds
  transitions: true        # dissolve between sections (hard cuts inside)
  motion: true             # a slow push or pull on every shot
  shot_min: 2.5            # seconds; shorter shots join the one before
  shot_max: 8              # seconds; longer shots split on a sentence

publish:
  enabled: true
  timezone: Australia/Brisbane
  slots:
    days: [tue, thu, sat]  # one video per slot, in production order
    at: "17:00"
  category: 27             # YouTube: 27 Education, 28 Science & Technology, 24 Entertainment
  tags: [explainer, documentary, how it works]
  description: |
    {summary}

    Chapters
    {chapters}

    Sources
    {sources}

    Narration, research and editing are automated; sources are linked above.

review: false              # true: stop after the video is made and wait for
                           # `channel.py approve <slug>` before uploading
