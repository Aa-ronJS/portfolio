# Cal.com — scheduling (replaces Calendly) -> https://cal.${BASE_DOMAIN}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: ${CALCOM_DB_PASSWORD}
      POSTGRES_DB: calcom
    volumes:
      - db:/var/lib/postgresql/data

  app:
    image: calcom/cal.com:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://calcom:${CALCOM_DB_PASSWORD}@db:5432/calcom
      DATABASE_DIRECT_URL: postgresql://calcom:${CALCOM_DB_PASSWORD}@db:5432/calcom
      NEXT_PUBLIC_WEBAPP_URL: https://cal.${BASE_DOMAIN}
      NEXTAUTH_URL: https://cal.${BASE_DOMAIN}
      NEXTAUTH_SECRET: ${CALCOM_NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALCOM_ENCRYPTION_KEY}
      NEXT_PUBLIC_LICENSE_CONSENT: agree
      NEXT_PUBLIC_DISABLE_SIGNUP: ${CALCOM_DISABLE_SIGNUP:-false}
      EMAIL_FROM: ${SMTP_FROM}
      EMAIL_SERVER_HOST: ${SMTP_HOST}
      EMAIL_SERVER_PORT: ${SMTP_PORT}
      EMAIL_SERVER_USER: ${SMTP_USER}
      EMAIL_SERVER_PASSWORD: ${SMTP_PASSWORD}
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.calcom.rule: Host(`cal.${BASE_DOMAIN}`)
      traefik.http.routers.calcom.entrypoints: websecure
      traefik.http.routers.calcom.tls.certresolver: le
      traefik.http.services.calcom.loadbalancer.server.port: 3000

volumes:
  db:

networks:
  proxy:
    external: true
