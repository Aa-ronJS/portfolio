# Umami — web analytics (replaces Google Analytics) -> https://analytics.${BASE_DOMAIN}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
      POSTGRES_DB: umami
    volumes:
      - db:/var/lib/postgresql/data

  app:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.umami.rule: Host(`analytics.${BASE_DOMAIN}`)
      traefik.http.routers.umami.entrypoints: websecure
      traefik.http.routers.umami.tls.certresolver: le
      traefik.http.services.umami.loadbalancer.server.port: 3000

volumes:
  db:

networks:
  proxy:
    external: true
