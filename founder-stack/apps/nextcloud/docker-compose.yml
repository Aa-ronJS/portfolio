# Nextcloud — files/storage/sync (replaces Dropbox/Google Drive) -> https://files.${BASE_DOMAIN}
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - db:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    image: nextcloud:29-apache
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: files.${BASE_DOMAIN}
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: files.${BASE_DOMAIN}
      TRUSTED_PROXIES: 172.16.0.0/12
    volumes:
      - data:/var/www/html
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.nextcloud.rule: Host(`files.${BASE_DOMAIN}`)
      traefik.http.routers.nextcloud.entrypoints: websecure
      traefik.http.routers.nextcloud.tls.certresolver: le
      traefik.http.services.nextcloud.loadbalancer.server.port: 80

volumes:
  db:
  data:

networks:
  proxy:
    external: true
