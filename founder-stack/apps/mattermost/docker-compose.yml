# Mattermost — team chat (replaces Slack) -> https://chat.${BASE_DOMAIN}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${MATTERMOST_DB_PASSWORD}
      POSTGRES_DB: mattermost
    volumes:
      - db:/var/lib/postgresql/data

  app:
    image: mattermost/mattermost-team-edition:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${MATTERMOST_DB_PASSWORD}@db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: https://chat.${BASE_DOMAIN}
      TZ: ${TZ}
    volumes:
      - config:/mattermost/config
      - data:/mattermost/data
      - logs:/mattermost/logs
      - plugins:/mattermost/plugins
      - client-plugins:/mattermost/client/plugins
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.mattermost.rule: Host(`chat.${BASE_DOMAIN}`)
      traefik.http.routers.mattermost.entrypoints: websecure
      traefik.http.routers.mattermost.tls.certresolver: le
      traefik.http.services.mattermost.loadbalancer.server.port: 8065

volumes:
  db:
  config:
  data:
  logs:
  plugins:
  client-plugins:

networks:
  proxy:
    external: true
