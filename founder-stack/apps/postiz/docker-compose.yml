# Social scheduler — plan and publish posts across your social accounts -> https://social.${BASE_DOMAIN}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD}
      POSTGRES_DB: postiz
    volumes:
      - db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data

  app:
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      MAIN_URL: https://social.${BASE_DOMAIN}
      FRONTEND_URL: https://social.${BASE_DOMAIN}
      NEXT_PUBLIC_BACKEND_URL: https://social.${BASE_DOMAIN}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      DATABASE_URL: postgresql://postiz:${POSTIZ_DB_PASSWORD}@db:5432/postiz
      REDIS_URL: redis://redis:6379
      IS_GENERAL: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      DISABLE_REGISTRATION: ${POSTIZ_DISABLE_REGISTRATION:-false}
      EMAIL_PROVIDER: ${SMTP_HOST:+nodemailer}
      EMAIL_HOST: ${SMTP_HOST}
      EMAIL_PORT: ${SMTP_PORT}
      EMAIL_USER: ${SMTP_USER}
      EMAIL_PASS: ${SMTP_PASSWORD}
      EMAIL_FROM_ADDRESS: ${SMTP_FROM}
      EMAIL_FROM_NAME: ${BRAND_NAME}
    volumes:
      - config:/config
      - uploads:/uploads
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.postiz.rule: Host(`social.${BASE_DOMAIN}`)
      traefik.http.routers.postiz.entrypoints: websecure
      traefik.http.routers.postiz.tls.certresolver: le
      traefik.http.services.postiz.loadbalancer.server.port: 5000

volumes:
  db:
  redis:
  config:
  uploads:

networks:
  proxy:
    external: true
