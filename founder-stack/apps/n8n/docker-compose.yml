# Automations — n8n, the full self-hosted community edition -> https://automate.${BASE_DOMAIN}
# Free for your own business (Sustainable Use License); see docs/SELLING.md before hosting it for others.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - db:/var/lib/postgresql/data

  app:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      N8N_HOST: automate.${BASE_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      # bind IPv4: hosts with IPv6 disabled fail n8n's '::' default
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_EDITOR_BASE_URL: https://automate.${BASE_DOMAIN}/
      WEBHOOK_URL: https://automate.${BASE_DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_EMAIL_MODE: smtp
      N8N_SMTP_HOST: ${SMTP_HOST}
      N8N_SMTP_PORT: ${SMTP_PORT}
      N8N_SMTP_USER: ${SMTP_USER}
      N8N_SMTP_PASS: ${SMTP_PASSWORD}
      N8N_SMTP_SENDER: ${SMTP_FROM}
    volumes:
      - data:/home/node/.n8n
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.n8n.rule: Host(`automate.${BASE_DOMAIN}`)
      traefik.http.routers.n8n.entrypoints: websecure
      traefik.http.routers.n8n.tls.certresolver: le
      traefik.http.services.n8n.loadbalancer.server.port: 5678

volumes:
  db:
  data:

networks:
  proxy:
    external: true
