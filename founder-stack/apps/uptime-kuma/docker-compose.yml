# Uptime Kuma — uptime monitoring & status page (replaces Pingdom/Statuspage) -> https://status.${BASE_DOMAIN}
services:
  app:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - data:/app/data
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.uptimekuma.rule: Host(`status.${BASE_DOMAIN}`)
      traefik.http.routers.uptimekuma.entrypoints: websecure
      traefik.http.routers.uptimekuma.tls.certresolver: le
      traefik.http.services.uptimekuma.loadbalancer.server.port: 3001

volumes:
  data:

networks:
  proxy:
    external: true
