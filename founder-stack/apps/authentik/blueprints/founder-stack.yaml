# Auto-provisions an OAuth2/OIDC provider + application in Authentik for every
# SSO-capable app in the stack. Client IDs are the app names; client secrets
# come from .env (passed into the worker's environment). Applied automatically
# by the authentik worker on startup; re-applied on changes (idempotent).
version: 1
metadata:
  name: Founder Stack SSO
  labels:
    blueprints.goauthentik.io/instantiate: "true"

context: {}

entries:
  # ---------- Vikunja (tasks) ----------
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: vikunja
    attrs: &provider-defaults
      client_type: confidential
      client_id: vikunja
      client_secret: !Env VIKUNJA_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://tasks.%s/auth/openid/authentik", !Env BASE_DOMAIN]
  - model: authentik_core.application
    identifiers:
      slug: vikunja
    attrs:
      name: Tasks (Vikunja)
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, vikunja]]
      meta_launch_url: !Format ["https://tasks.%s", !Env BASE_DOMAIN]

  # ---------- Mattermost (chat, via its GitLab-compatible OAuth) ----------
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: mattermost
    attrs:
      <<: *provider-defaults
      client_id: mattermost
      client_secret: !Env MATTERMOST_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://chat.%s/login/gitlab/complete", !Env BASE_DOMAIN]
        - matching_mode: strict
          url: !Format ["https://chat.%s/signup/gitlab/complete", !Env BASE_DOMAIN]
  - model: authentik_core.application
    identifiers:
      slug: mattermost
    attrs:
      name: Chat (Mattermost)
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, mattermost]]
      meta_launch_url: !Format ["https://chat.%s", !Env BASE_DOMAIN]

  # ---------- Documenso (signatures) ----------
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: documenso
    attrs:
      <<: *provider-defaults
      client_id: documenso
      client_secret: !Env DOCUMENSO_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://sign.%s/api/auth/callback/oidc", !Env BASE_DOMAIN]
  - model: authentik_core.application
    identifiers:
      slug: documenso
    attrs:
      name: Signatures (Documenso)
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, documenso]]
      meta_launch_url: !Format ["https://sign.%s", !Env BASE_DOMAIN]

  # ---------- Vaultwarden (passwords; experimental upstream SSO) ----------
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: vaultwarden
    attrs:
      <<: *provider-defaults
      client_id: vaultwarden
      client_secret: !Env VAULTWARDEN_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://vault.%s/identity/connect/oidc-signin", !Env BASE_DOMAIN]
  - model: authentik_core.application
    identifiers:
      slug: vaultwarden
    attrs:
      name: Passwords (Vaultwarden)
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, vaultwarden]]
      meta_launch_url: !Format ["https://vault.%s", !Env BASE_DOMAIN]

  # ---------- Listmonk (newsletter; paste values in its admin UI, docs/SSO.md) ----------
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: listmonk
    attrs:
      <<: *provider-defaults
      client_id: listmonk
      client_secret: !Env LISTMONK_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://newsletter.%s/auth/oidc", !Env BASE_DOMAIN]
  - model: authentik_core.application
    identifiers:
      slug: listmonk
    attrs:
      name: Newsletter (Listmonk)
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, listmonk]]
      meta_launch_url: !Format ["https://newsletter.%s", !Env BASE_DOMAIN]

  # ---------- Nextcloud (files; enable via occ commands, docs/SSO.md) ----------
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: nextcloud
    attrs:
      <<: *provider-defaults
      client_id: nextcloud
      client_secret: !Env NEXTCLOUD_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://files.%s/index.php/apps/user_oidc/code", !Env BASE_DOMAIN]
        - matching_mode: strict
          url: !Format ["https://files.%s/apps/user_oidc/code", !Env BASE_DOMAIN]
  - model: authentik_core.application
    identifiers:
      slug: nextcloud
    attrs:
      name: Files (Nextcloud)
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, nextcloud]]
      meta_launch_url: !Format ["https://files.%s", !Env BASE_DOMAIN]
