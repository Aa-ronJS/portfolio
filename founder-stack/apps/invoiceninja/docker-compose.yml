# Invoice Ninja — invoicing/accounting (replaces FreshBooks) -> https://invoices.${BASE_DOMAIN}
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${INVOICENINJA_DB_PASSWORD}
      MYSQL_DATABASE: ninja
      MYSQL_USER: ninja
      MYSQL_PASSWORD: ${INVOICENINJA_DB_PASSWORD}
    volumes:
      - db:/var/lib/mysql

  app:
    image: invoiceninja/invoiceninja:5
    restart: unless-stopped
    depends_on:
      - db
    environment:
      APP_KEY: ${INVOICENINJA_APP_KEY}
      APP_URL: https://invoices.${BASE_DOMAIN}
      APP_ENV: production
      REQUIRE_HTTPS: "true"
      TRUSTED_PROXIES: "*"
      DB_HOST: db
      DB_DATABASE: ninja
      DB_USERNAME: ninja
      DB_PASSWORD: ${INVOICENINJA_DB_PASSWORD}
      # Initial admin account (created on first boot)
      IN_USER_EMAIL: ${ADMIN_EMAIL}
      IN_PASSWORD: ${ADMIN_PASSWORD}
      MAIL_MAILER: smtp
      MAIL_HOST: ${SMTP_HOST}
      MAIL_PORT: ${SMTP_PORT}
      MAIL_USERNAME: ${SMTP_USER}
      MAIL_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM_ADDRESS: ${SMTP_FROM}
      MAIL_FROM_NAME: "Invoices"
    volumes:
      - public:/var/www/app/public
      - storage:/var/www/app/storage

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/app/public:ro
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.invoiceninja.rule: Host(`invoices.${BASE_DOMAIN}`)
      traefik.http.routers.invoiceninja.entrypoints: websecure
      traefik.http.routers.invoiceninja.tls.certresolver: le
      traefik.http.services.invoiceninja.loadbalancer.server.port: 80

volumes:
  db:
  public:
  storage:

networks:
  proxy:
    external: true
