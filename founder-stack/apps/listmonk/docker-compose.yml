# Listmonk — email marketing (replaces Mailchimp) -> https://newsletter.${BASE_DOMAIN}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD}
      POSTGRES_DB: listmonk
    volumes:
      - db:/var/lib/postgresql/data

  app:
    image: listmonk/listmonk:latest
    restart: unless-stopped
    depends_on:
      - db
    command: [sh, -c, "./listmonk --install --idempotent --yes --config '' && ./listmonk --config ''"]
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_USER: ${ADMIN_USER}
      LISTMONK_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TZ: ${TZ}
    volumes:
      - uploads:/listmonk/uploads
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.listmonk.rule: Host(`newsletter.${BASE_DOMAIN}`)
      traefik.http.routers.listmonk.entrypoints: websecure
      traefik.http.routers.listmonk.tls.certresolver: le
      traefik.http.services.listmonk.loadbalancer.server.port: 9000

volumes:
  db:
  uploads:

networks:
  proxy:
    external: true
