<style>
/* App shell: 232px sidebar + content column (max 1080). Tables open a right-hand drawer. One accent, semantic colours for state only. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --raised: #ffffff; --ink: #111418; --muted: #667085; --faint: #98a2b3;
  --line: #e4e7ec; --line-strong: #d0d5dd; --hover: #f2f4f7;
  --accent: #0e7c66; --accent-ink: #ffffff; --accent-soft: #e3f3ee; --accent-text: #0b6b58;
  --good: #137a3d; --good-bg: #e6f4ea; --warn: #9a5b00; --warn-bg: #fff3dd; --bad: #b42318; --bad-bg: #fde9e7; --info: #3b4c9a; --info-bg: #e9ecfb;
  --shadow: 0 1px 2px rgba(16,24,40,.05); --shadow-lg: 0 20px 48px rgba(16,24,40,.18);
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1216; --surface: #161a20; --raised: #1b2027; --ink: #e9ecf1; --muted: #98a2b3; --faint: #667085;
  --line: #262c35; --line-strong: #343b46; --hover: #1e242c;
  --accent: #3cc8a8; --accent-ink: #06211b; --accent-soft: #15302a; --accent-text: #5fd6bb;
  --good: #5fd08a; --good-bg: #16301f; --warn: #f0b35a; --warn-bg: #3a2a10; --bad: #f58a7e; --bad-bg: #3c1c19; --info: #9fb0ff; --info-bg: #1f2540;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 20px 48px rgba(0,0,0,.6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #161a20; --raised: #1b2027; --ink: #e9ecf1; --muted: #98a2b3; --faint: #667085;
  --line: #262c35; --line-strong: #343b46; --hover: #1e242c;
  --accent: #3cc8a8; --accent-ink: #06211b; --accent-soft: #15302a; --accent-text: #5fd6bb;
  --good: #5fd08a; --good-bg: #16301f; --warn: #f0b35a; --warn-bg: #3a2a10; --bad: #f58a7e; --bad-bg: #3c1c19; --info: #9fb0ff; --info-bg: #1f2540;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 20px 48px rgba(0,0,0,.6); color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--ui); -webkit-font-smoothing: antialiased }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; text-wrap: balance }
h1 { font-size: 20px } h2 { font-size: 15px } h3 { font-size: 14px }
p { margin: 0 } a { color: var(--accent-text) }
.muted { color: var(--muted) } .faint { color: var(--faint) } .sm { font-size: 12.5px } .xs { font-size: 11.5px }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px }
.strong { font-weight: 600 }
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100% }
.main { min-width: 0 }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 14px; font-weight: 700; font-size: 15px; letter-spacing: -.02em }
.brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-size: 12px; font-weight: 700 }
.ws { padding: 0 8px 12px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px }
.ws b { color: var(--ink); font-weight: 600 }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 10px; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 500; border-radius: 7px; cursor: pointer }
.nav button:hover { background: var(--hover); color: var(--ink) }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text) }
.nav .count { margin-left: auto; font-size: 11px; background: var(--hover); color: var(--muted); padding: 1px 7px; border-radius: 999px; font-family: var(--mono) }
.nav button[aria-current="page"] .count { background: var(--surface) }
.side .foot { margin-top: auto; padding: 8px }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 28px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
.topbar .title { display: flex; align-items: baseline; gap: 10px; min-width: 0 }
.content { padding: 24px 28px 96px; max-width: 1080px; width: 100%; display: flex; flex-direction: column; gap: 20px; min-width: 0 }
.btn.menu-btn { display: none }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr }
  .side { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 20; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow-lg) }
  .side.open { transform: none }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 19 }
  .btn.menu-btn { display: inline-flex }
  .topbar, .content { padding-inline: 16px }
}
@media (prefers-reduced-motion: reduce) { .side, .drawer { transition: none } }

.account { position: relative }
.avatar { width: 30px; height: 30px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font-weight: 700; font-size: 12px; border: 1px solid var(--line); cursor: pointer }
.pop { position: absolute; right: 0; top: 38px; width: 260px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 30 }
.pop .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 8px 10px 4px }
.pop button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 7px 10px; border: 0; background: none; font: inherit; color: var(--ink); border-radius: 7px; cursor: pointer; text-align: left }
.pop button:hover { background: var(--hover) }
.pop button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-text) }
.pop .dot { width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--hover); color: var(--muted); flex: none }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0 }
.tile .k { font-size: 12px; color: var(--muted); font-weight: 500 }
.tile .v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums }
.tile .s { font-size: 12px; color: var(--muted); margin-top: 2px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0 }
.panel .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.panel .body { padding: 16px }
.panel .body.tight { padding: 0 }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.between { justify-content: space-between }
.stack { display: flex; flex-direction: column; gap: 12px }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px }

.btn { font: inherit; font-weight: 500; font-size: 13.5px; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.btn:hover { background: var(--hover) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.primary:hover { filter: brightness(1.05) }
.btn.danger { color: var(--bad); border-color: var(--bad) }
.btn.ghost { border-color: transparent; background: none; color: var(--accent-text) }
.btn.sm { padding: 4px 9px; font-size: 12.5px }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text) }
:is(button, input, select, textarea, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--hover); color: var(--muted); white-space: nowrap }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: currentColor; opacity: .8 }
.chip.good { background: var(--good-bg); color: var(--good) }
.chip.warn { background: var(--warn-bg); color: var(--warn) }
.chip.bad { background: var(--bad-bg); color: var(--bad) }
.chip.info { background: var(--info-bg); color: var(--info) }
.chip.accent { background: var(--accent-soft); color: var(--accent-text) }
.chip.plain::before { display: none }

.steps { display: flex; gap: 0; overflow-x: auto; padding: 4px 0 }
.step { flex: 1; min-width: 86px; position: relative; padding-top: 14px; font-size: 12px; color: var(--faint); white-space: nowrap }
.step::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 3px; background: var(--line) }
.step.done::before { background: var(--accent) }
.step.now::before { background: var(--accent); opacity: .5 }
.step.done, .step.now { color: var(--ink) } .step.now { font-weight: 600 }

table { border-collapse: collapse; width: 100%; font-size: 13.5px }
th { text-align: left; font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr:last-child td { border-bottom: 0 }
tr.click { cursor: pointer } tr.click:hover td { background: var(--hover) }
td.r, th.r { text-align: right } td.num { font-family: var(--mono); font-size: 12.5px }
.scroll { overflow-x: auto }
.bar { height: 6px; border-radius: 999px; background: var(--line); width: 72px; display: inline-block; vertical-align: middle; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent) }
.score { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12.5px }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); font-size: 13.5px }

label { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-bottom: 5px }
input[type=text], textarea, select { width: 100%; font: inherit; font-size: 13.5px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--ink) }
textarea { min-height: 72px; resize: vertical }
select { appearance: auto }
.field { min-width: 0 }
.help { font-size: 12px; color: var(--faint); margin-top: 4px }
.callout { padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 500 }
.callout.bad { background: var(--bad-bg); color: var(--bad) }
.callout.info { background: var(--info-bg); color: var(--info) }
.callout.good { background: var(--good-bg); color: var(--good) }
.qa { display: grid; gap: 10px }
.qa .q { font-size: 12px; color: var(--muted); font-weight: 500 }
.qa .a { white-space: pre-wrap; font-size: 13.5px; margin-top: 2px }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13.5px }
.kv dt { color: var(--muted) } .kv dd { margin: 0; min-width: 0 }
.list { display: flex; flex-direction: column }
.list > div { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.list > div:last-child { border-bottom: 0 }

.drawer-wrap { position: fixed; inset: 0; z-index: 40; display: none }
.drawer-wrap.open { display: block }
.drawer-wrap .scrim2 { position: absolute; inset: 0; background: rgba(16,24,40,.4) }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; transform: translateX(0) }
.drawer .dhead { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px }
.drawer .dbody { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; flex: 1 }
.drawer .dfoot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between }
.drawer .tiles { grid-template-columns: repeat(3, 1fr) }
.dfoot .grp { display: flex; gap: 6px; align-items: center }
.x { border: 0; background: none; font-size: 18px; color: var(--muted); cursor: pointer; line-height: 1; padding: 2px 6px; border-radius: 6px }
.x:hover { background: var(--hover); color: var(--ink) }

.toasts { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 50; pointer-events: none }
.toast { background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); animation: up .2s ease-out }
@keyframes up { from { opacity: 0; transform: translateY(6px) } }
.sandbox { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--raised); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 2px; padding: 4px 6px 4px 12px; font-size: 12px }
.sandbox .tag { color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 10.5px; margin-right: 6px }
.sandbox button { border: 0; background: none; font: inherit; font-size: 12.5px; font-weight: 500; color: var(--ink); padding: 5px 9px; border-radius: 999px; cursor: pointer }
.sandbox button:hover { background: var(--hover) }
.sandbox button:disabled { opacity: .4; cursor: default }
.hero { padding: 28px 24px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center }
.hero h1 { font-size: 22px }
.rate { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; font-size: 13px }
.rate select { width: auto; min-width: 90px }
.ai { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px }
.spin { width: 12px; height: 12px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 999px; animation: spin .8s linear infinite; display: inline-block }
@keyframes spin { to { transform: rotate(360deg) } }
.lgrow { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 13px }
.lgrow:last-child { border-bottom: 0 }
.lgrow .d { color: var(--faint); font-family: var(--mono); font-size: 12px; padding-top: 1px }
.lgrow .e { font-weight: 500 } .lgrow .t { color: var(--muted) }
.wizard { max-width: 640px }
.dots { display: flex; gap: 6px } .dots i { width: 22px; height: 3px; border-radius: 2px; background: var(--line) } .dots i.on { background: var(--accent) }
</style>

<script>

const SEED = {
  brief: {
    product: 'Loop Laundry picks up your washing from your door, washes and folds it, and brings it back within 48 hours.',
    audience: 'People in the inner north with no washing machine. Not dry cleaning, doonas or commercial loads.',
    job: 'Book one pickup on the website, hand over a bag of up to 8 kg, get it back within 48 hours. About 15 minutes of your time. The first load is free.',
    wants: ['Booking: was it clear when we would arrive and what to leave out?', 'Handover: did anything about the bag, the label or the pickup confuse you?', 'Return and payment: was the return on time, and was paying clear?'],

      review: ['The booking page said "we will text you a window the night before" and the text came at 9:40pm with a 1pm to 5pm window. That was fine, but the page also asked for a flat number and there was no field for a gate code, so the driver rang me from the street.', 'The bag was the stripey one from the welcome email, easy. The label had my name but not a date, so when I had two bags on the second week I could not tell which was which.', 'Returned in 46 hours. Paying was a link in the return email, worked first go on my phone.'],
      closing: ['Book a pickup for Tuesday and get my washing back by Thursday.', 'Nowhere. Only slowed down by the gate code thing.', 'About $25 a load, maybe $30 if the window were 2 hours.'],
      bugs: [{ title: 'No field for a gate code at booking', happened: 'Booking asks for a flat number but there is nowhere to put a gate or intercom code, so the driver had to call me from the street.', instead: 'Add an optional "how to get to the door" line to the booking form.', where: 'Booking' }] },
    { id: 'r2', pseudonym: 'Amber Fox', rep: null, knew: 'yes', truth: 2,
      review: ['Everything was perfect, really easy to book!', 'Loved the bag, no confusion at all.', 'Came back fast and paying was simple. 10 out of 10, would recommend to anyone!'],
      closing: ['Get my washing done.', 'Nowhere.', 'Whatever they charge.'], bugs: [] },
    { id: 'r3', pseudonym: 'Grey Otter', rep: { sum: 936, n: 12 }, knew: 'no', truth: 5,

    { id: 'r4', pseudonym: 'Blue Wren', rep: null, knew: 'no', truth: 4,

const PLACES = [['Neighbourhood Facebook groups', 'Say it is paid and private'], ['Local subreddit or forum', 'Message a mod first'], ['Your waitlist and past enquiries', 'Best strangers you have'], ['Building and strata noticeboards', 'Ask the manager'], ['Cafe pinboards', 'Poster with a QR code']];

function fresh() {
  return { role: 'business', who: 'r1', page: 'overview', day: 1, aiMode: null, periodNo: 1, history: [],
    credits: { balance: 0, locked: 0, ledger: [] }, briefs: [], period: { state: 'draft', briefV: null, cost: 0 },

  const mine = cur(S.reviews).filter(x => S.assignments[x.id] && S.assignments[x.id].includes(r.id));
  const steps = [
    ['review', 'Write your review', rv ? chip('Submitted', 'good') : chip('To do', 'warn')],
    ['issues', 'Report issues', chip(`${cur(S.bugs).filter(x => x.reviewerId === r.id).length} reported`, '', true)],
    ['rate', 'Rate three peers', p.state === 'rating' && !S.ratingsDone[r.id] ? chip(`${mine.length} waiting`, 'warn') : S.ratingsDone[r.id] ? chip('Done', 'good') : chip('After the open stage', '', true)],
  ];
  return `<div class="tiles"><div class="tile"><div class="k">Reputation</div><div class="v">${repOf(r)}</div><div class="s">${r.rep.n} scored</div></div><div class="tile"><div class="k">This period</div><div class="v">${money(FEE)}</div><div class="s">${r.payout ? r.payout + (r.payoutReason ? ' · ' + r.payoutReason : '') : 'after review + ratings'}</div></div><div class="tile"><div class="k">Issue payouts</div><div class="v">${money(cur(S.bugs).filter(x => x.reviewerId === r.id && x.unlocked).reduce((s, x) => s + x.paidOut, 0))}</div><div class="s">on unlock</div></div></div>
    <div class="panel"><div class="body tight"><div class="list">${steps.map(([pg, t, c]) => `<div><span class="strong">${t}</span><span class="row">${c}${btn('page', 'Open', `data-v="${pg}"`, 'btn sm')}</span></div>`).join('')}</div></div></div>
    ${rv && rv.scores ? `<div class="panel"><div class="head"><h2>Your score</h2>${scoreCell(rv.scores)}</div><div class="body"><dl class="kv"><dt>On brief</dt><dd class="num">${rv.scores.onBrief}</dd><dt>Quality</dt><dd class="num">${rv.scores.quality}</dd><dt>Peers</dt><dd class="num">${rv.scores.peer ?? '—'}</dd>${rv.status ? `<dt>Business</dt><dd>${esc(rv.status)}</dd>` : ''}</dl></div></div>` : ''}
    ${flagOf(rv ? rv.id : '').map(f => `<div class="panel"><div class="head"><h2>Flag · ${esc(f.reason)}</h2>${flagChip(f)}</div><div class="body stack">${f.state === 'queued' && !f.reply ? `<div class="field"><label for="reply-${f.id}">Your reply (once)</label><textarea id="reply-${f.id}"></textarea></div><div>${btn('reply', 'Send', `data-id="${f.id}"`, 'btn primary sm')}</div>` : f.reply ? `<p class="sm">“${esc(f.reply)}”</p>` : `<p class="sm muted">${f.state === 'decided' ? 'Decided: ' + esc(f.decision) : 'Cleared'}</p>`}</div></div>`).join('')}`;
}
function rReview() {
  const r = reviewer(S.who), ex = SEED.reviewers.find(x => x.id === r.id), b = brief(), rv = cur(S.reviews).find(x => x.reviewerId === r.id);
  if (rv) return `<div class="panel"><div class="head"><h2>Submitted day ${rv.day}</h2>${scoreCell(rv.scores)}</div><div class="body qa">${b.wants.map((q, i) => `<div><div class="q">${esc(q)}</div><div class="a">${esc(rv.sections[i])}</div></div>`).join('')}<div><div class="q">Tried to do · stopped at · would pay</div><div class="a">${rv.closing.map(esc).join('\n')}</div></div></div></div>`;
  if (r.seat !== 'accepted') return `<div class="panel"><div class="empty">Accept the invitation first</div></div>`;
  return `<div class="panel wizard"><div class="head"><h2>Your review</h2><span class="sm muted">Draft restored</span></div><div class="body stack">
    <div class="row"><input type="checkbox" id="received" ${r.received ? 'checked' : ''} data-act="received"><label for="received" style="margin:0">I have received the free product</label></div>
    ${b.wants.map((q, i) => `<div class="field"><label for="sec${i}">${esc(q)}</label><textarea id="sec${i}">${esc(ex.review[i])}</textarea></div>`).join('')}
    ${['What did you try to do?', 'Where did you stop, if anywhere?', 'What would you pay?'].map((q, i) => `<div class="field"><label for="clo${i}">${esc(q)}</label><input type="text" id="clo${i}" value="${esc(ex.closing[i])}"></div>`).join('')}
    <div class="row between"><span class="sm muted">${money(FEE)} after peer ratings</span>${btn('submit-review', 'Submit review', '', 'btn primary')}</div></div></div>`;
}
function rIssues() {
  const r = reviewer(S.who), ex = SEED.reviewers.find(x => x.id === r.id), b = brief(), p = S.period;
  const mine = cur(S.bugs).filter(x => x.reviewerId === r.id);
  const published = [...b.known.map(k => ({ title: k, status: 'known' })), ...S.bugs.filter(x => x.unlocked).map(x => ({ title: x.title, status: x.status || 'unlocked' }))];
  const canReport = ['accepted', 'submitted', 'rated'].includes(r.seat) && p.state === 'open';
  const next = ex.bugs[mine.length] || { title: '', happened: '', instead: '', where: '' };
  return `<div class="row between"><span class="sm muted">Process issues, not software bugs. Paid on unlock by peer score.</span>${canReport && !S.bugForm ? btn('bugform', 'Report an issue', '', 'btn primary sm') : ''}</div>
    ${S.pendingDup && S.pendingDup.reviewerId === r.id ? `<div class="panel"><div class="body stack"><div class="callout">Looks like “${esc(S.pendingDup.match.title)}”</div><div class="row">${S.pendingDup.match.id.startsWith('known') ? '' : btn('dup-confirm', 'Confirm that one instead')}${btn('dup-anyway', 'Mine is different', '', 'btn primary')}${btn('dup-cancel', 'Cancel', '', 'btn ghost')}</div></div></div>` : ''}
    ${S.bugForm && canReport && !S.pendingDup ? `<div class="panel wizard"><div class="head"><h2>Report an issue</h2>${btn('bugform-close', '✕', 'aria-label="Close"', 'x')}</div><div class="body stack">
      <div class="field"><label for="bug-title">Title</label><input type="text" id="bug-title" value="${esc(next.title)}"></div>
      <div class="field"><label for="bug-happened">What happened</label><textarea id="bug-happened">${esc(next.happened)}</textarea></div>
      <div class="field"><label for="bug-instead">What should happen instead</label><input type="text" id="bug-instead" value="${esc(next.instead)}"></div>
      <div class="field"><label for="bug-where">Where in the journey</label><input type="text" id="bug-where" value="${esc(next.where)}"></div>
      <div class="row between"><span></span>${btn('submit-bug', 'Submit', '', 'btn primary')}</div></div></div>` : ''}
    <div class="panel"><div class="head"><h2>Yours</h2></div><div class="body tight">${mine.length ? `<div class="list">${mine.map(x => `<div><span>${esc(x.title)}</span>${x.dupOf ? chip('Confirmation', '', true) : x.unlocked ? chip(`Unlocked · ${money(x.paidOut)} to you`, 'good') : x.scores ? (x.tier ? chip(`${x.tier.name} · ${money(x.tier.price)}`, 'accent') : chip('Not listed', 'bad')) : chip('Awaiting peer score', 'warn')}</div>`).join('')}</div>` : '<div class="empty">Nothing reported yet</div>'}</div></div>
    <div class="panel"><div class="head"><h2>Already on the list</h2><span class="sm muted">not paid again</span></div><div class="body tight"><div class="list">${published.map(x => `<div><span>${esc(x.title)}</span>${chip(x.status, '', true)}</div>`).join('') || '<div class="empty">Empty</div>'}</div></div></div>`;
}
function rRate() {
  const r = reviewer(S.who), p = S.period;
  if (p.state !== 'rating' && !S.ratingsDone[r.id]) return `<div class="panel"><div class="empty">Opens when the open stage ends</div></div>`;
  if (S.ratingsDone[r.id]) return `<div class="panel"><div class="hero"><h1>Ratings submitted</h1><p class="muted">${p.state === 'rating' ? 'Waiting for the other raters, or 7 days' : 'Period settled'}</p></div></div>`;
  const mine = cur(S.reviews).filter(rv => S.assignments[rv.id].includes(r.id));
  return `<div class="row between"><span class="sm muted">Blind. Random. Text only. Your fee releases after this.</span></div>
    ${mine.map((rv, i) => `<div class="panel"><div class="head"><h2>Review ${i + 1} of ${mine.length}</h2></div><div class="body stack"><div class="qa"><div class="a">${esc(rv.sections.join('\n\n'))}</div></div><div class="rate">
      <span>Truthful as far as you can tell</span><select id="rt-${rv.id}-truthful"><option>yes</option><option>no</option></select>
      <span>Fair</span><select id="rt-${rv.id}-fair"><option>yes</option><option>no</option></select>
      <span>Matches your experience</span><select id="rt-${rv.id}-matches"><option>yes</option><option>partly</option><option>no</option></select>
      <span>Useful, 1 to 5</span><select id="rt-${rv.id}-useful">${[5, 4, 3, 2, 1].map(n => `<option ${n === 3 ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <span>Flag</span><select id="rt-${rv.id}-flag"><option value="">none</option>${FLAG_REASONS.map(x => `<option>${x}</option>`).join('')}</select></div></div></div>`).join('')}
    <div class="row between"><span></span>${btn('submit-ratings', 'Submit ratings', '', 'btn primary')}</div>`;
}

// Admin pages
function aQueue() {
  const queue = S.flags.filter(f => f.state === 'queued'), done = S.flags.filter(f => f.state !== 'queued' && f.state !== 'triage');
  const card = f => { const t = targetOf(f), r = reviewer(t.reviewerId); return `<div class="panel"><div class="head"><div class="row"><h2>${esc(f.reason)}</h2>${chip(r.pseudonym, '', true)}${chip(`by ${f.source === 'ai' ? 'AI' : f.source === 'business' ? 'business' : 'peer'}`, '', true)}${r.knew === 'yes' ? chip('knew business', 'warn') : ''}${r.strikes ? chip(`${r.strikes} strike`, 'bad') : ''}</div>${f.state === 'queued' ? `<span class="sm muted">auto-release day ${f.day + 7}</span>` : flagChip(f)}</div>
    <div class="body stack"><div class="qa"><div class="a sm">${esc(f.targetType === 'review' ? t.sections.join('\n') : t.title + '. ' + t.happened)}</div></div>
    ${f.ai ? `<div class="callout ${f.ai.verdict === 'breach' ? 'bad' : f.ai.verdict === 'clear' ? 'good' : 'info'}">AI · ${esc(f.ai.verdict)} · ${Math.round(f.ai.confidence * 100)}% · ${esc(f.ai.reasoning)}</div>` : `<span class="ai"><span class="spin"></span> triaging</span>`}
    ${f.reply ? `<p class="sm">Reviewer: “${esc(f.reply)}”</p>` : ''}
    ${f.state === 'queued' ? `<div class="row">${btn('decide', 'Clear', `data-id="${f.id}" data-v="clear"`)}${btn('decide', 'Low quality', `data-id="${f.id}" data-v="low quality"`)}${btn('decide', 'Breach', `data-id="${f.id}" data-v="breach"`, 'btn danger')}</div>` : `<span class="sm muted">${esc(f.decidedBy || '')} · day ${f.decidedDay || ''}</span>`}</div></div>` };
  return `${queue.length ? queue.map(card).join('') : `<div class="panel"><div class="empty">Queue is empty</div></div>`}${done.length ? `<h2 class="muted" style="margin-top:8px">Decided</h2>${done.slice().reverse().map(card).join('')}` : ''}`;
}
function aReviewers() {
  return `<div class="panel"><div class="body tight scroll"><table><thead><tr><th>Reviewer</th><th class="r">Reputation</th><th class="r">Scored</th><th>Account</th><th>Seat</th><th>Payout</th></tr></thead><tbody>${S.reviewers.map(r => `<tr><td class="strong">${esc(r.pseudonym)}</td><td class="r num">${repOf(r)}</td><td class="r num">${r.rep.n}</td><td>${chip(r.status, r.status === 'active' ? 'good' : r.status === 'warned' ? 'warn' : 'bad')}</td><td>${seatChip(r)}</td><td>${payoutChip(r)}</td></tr>`).join('')}</tbody></table></div></div>
    <p class="xs faint">Reputation = (60 × 5 + Σ usefulness) ÷ (5 + n)</p>`;
}

// Drawer
function renderDrawer() {
  const d = S.drawer, el = $('#drawer'); el.className = 'drawer-wrap' + (d ? ' open' : ''); if (!d) { el.innerHTML = ''; return }
  let head = '', body = '', foot = '';
  if (d.kind === 'review') {
    const rv = S.reviews.find(x => x.id === d.id), r = reviewer(rv.reviewerId), b = S.briefs.find(x => x.v === rv.briefV), fl = flagOf(rv.id);
    head = `<div><h2>${esc(r.pseudonym)}</h2><div class="sm muted">Reputation ${repOf(r)} · knew you: ${esc(r.knew)} · brief v${rv.briefV} · day ${rv.day}</div></div>`;
    body = `${rv.scores ? `<div class="tiles"><div class="tile"><div class="k">Usefulness</div><div class="v">${rv.scores.usefulness}</div></div><div class="tile"><div class="k">On brief</div><div class="v">${rv.scores.onBrief}</div></div><div class="tile"><div class="k">Quality</div><div class="v">${rv.scores.quality}</div><div class="s">peers ${rv.scores.peer ?? '—'}</div></div></div>` : `<div class="callout info">Scores arrive when peer rating ends</div>`}
      ${fl.map(f => `<div class="callout ${f.state === 'decided' && f.decision === 'breach' ? 'bad' : f.state === 'queued' || f.state === 'triage' ? '' : 'good'}">${esc(f.reason)} · ${f.source === 'business' ? 'you' : f.source === 'ai' ? 'AI' : 'peer'} · ${esc(f.state === 'decided' ? f.decision : f.state)}</div>`).join('')}
      <div class="qa">${b.wants.map((q, i) => `<div><div class="q">${esc(q)}</div><div class="a">${esc(rv.sections[i])}</div></div>`).join('')}<div><div class="q">Tried to do · stopped at · would pay</div><div class="a">${rv.closing.map(esc).join('\n')}</div></div></div>`;
    foot = `<div class="grp">${statusBtns('review', rv.id, rv.status)}</div>${!fl.some(f => f.source === 'business') ? `<div class="grp"><select id="flag-${rv.id}" aria-label="Flag reason" style="width:auto;padding:5px 8px;font-size:12.5px"><option value="">Flag…</option>${FLAG_REASONS.map(x => `<option>${x}</option>`).join('')}</select>${btn('flag', 'Flag', `data-id="${rv.id}"`, 'btn sm')}</div>` : ''}`;
  } else {
    const bg = S.bugs.find(x => x.id === d.id), r = reviewer(bg.reviewerId);
    head = `<div><h2>${esc(bg.title)}</h2><div class="sm muted">${esc(bg.ai.category)} · ${esc(r.pseudonym)} · unlocked day ${bg.unlockDay} · ${money(bg.tier.price)}</div></div>`;
    body = `<div class="tiles"><div class="tile"><div class="k">Usefulness</div><div class="v">${bg.scores.usefulness}</div></div><div class="tile"><div class="k">On brief</div><div class="v">${bg.scores.onBrief}</div></div><div class="tile"><div class="k">Confirmed by</div><div class="v">${bg.confirmations}</div></div></div>
      <div class="qa"><div><div class="q">Where</div><div class="a">${esc(bg.where)}</div></div><div><div class="q">What happened</div><div class="a">${esc(bg.happened)}</div></div><div><div class="q">Should happen instead</div><div class="a">${esc(bg.instead)}</div></div></div>`;
    foot = `<div class="grp">${statusBtns('bug', bg.id, bg.status)}</div>`;
  }
  el.innerHTML = `<div class="scrim2" data-act="close"></div><div class="drawer" role="dialog" aria-modal="true"><div class="dhead">${head}<button class="x" data-act="close" aria-label="Close">✕</button></div><div class="dbody">${body}</div><div class="dfoot">${foot}</div></div>`;
}

// ---------- events ----------
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || el.type === 'checkbox') { if (!ev.target.closest('.account') && S.menu) { S.menu = false; renderTop() } return }
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v; const r = S.role === 'reviewer' ? reviewer(S.who) : null;
  const run = async fn => { await fn(); save(); render() };
  if (act !== 'menu' && act !== 'viewas' && S.menu) S.menu = false;
  if (act === 'menu') { S.menu = !S.menu; return renderTop() }
  if (act === 'viewas') return run(() => { S.role = el.dataset.role; if (el.dataset.who) S.who = el.dataset.who; S.menu = false; S.drawer = null; S.page = S.role === 'business' ? 'overview' : S.role === 'reviewer' ? 'home' : 'queue' });
  if (act === 'page') return run(() => { S.page = v; S.side = false; S.drawer = null });
  if (act === 'side') return run(() => { S.side = !S.side });
  if (act === 'open') return run(() => { S.drawer = { kind: el.dataset.kind, id } });
  if (act === 'close') return run(() => { S.drawer = null });
  if (act === 'reset') { S = null; try { localStorage.removeItem(KEY) } catch (e) {} await seed(); return run(() => {}) }
  if (act === 'simulate') return simulate(S.role === 'reviewer' ? S.who : null);
  if (act === 'advance') return run(() => { advance7(); toast(`Day ${S.day}`) });
  if (act === 'buy') return run(() => { buyPack(); toast(`${money(PACK)} added`) });
  if (act === 'fund') return run(() => { if (fundPeriod()) toast(`${money(S.period.cost)} locked`) });
  if (act === 'recruit') return run(() => { openRecruiting(); toast('Invite links ready') });
  if (act === 'endopen') return run(endOpen);
  if (act === 'newperiod') return run(newPeriod);
  if (act === 'copy') { const t = $('#post').textContent; try { await navigator.clipboard.writeText(t); toast('Copied') } catch (e) { const s = window.getSelection(), rg = document.createRange(); rg.selectNodeContents($('#post')); s.removeAllRanges(); s.addRange(rg) } return }
  if (act === 'unlock') return run(() => { const b = S.bugs.find(x => x.id === id); if (unlockBug(id)) { toast(`Unlocked · ${money(b.tier.price)}`); S.drawer = { kind: 'bug', id } } });
  if (act === 'unlockall') return run(() => { let n = 0; cur(S.bugs).filter(b => !b.dupOf && b.scores && b.tier && !b.unlocked).forEach(b => { if (unlockBug(b.id)) n++ }); toast(`${n} unlocked`) });
  if (act === 'status') return run(() => setStatus(el.dataset.kind, id, v));
  if (act === 'flag') { const sel = $('#flag-' + id); if (!sel || !sel.value) return; return run(() => { raiseFlag('review', id, 'business', sel.value); toast('Flagged · triage started') }) }
  if (act === 'decide') return run(() => { decideFlag(id, v); toast(v === 'breach' ? 'Breach recorded' : 'Flag closed') });
  if (act === 'wz-start') { const last = latestBrief(); const a = last ? { product: last.product, audience: last.audience, job: last.job, wants: [...last.wants], known: [...last.known], wontChange: last.wontChange, eligibility: last.eligibility } : { product: '', audience: '', job: '', wants: [], known: [], wontChange: '', eligibility: '' }; return run(() => { S.wizard = { step: 0, answers: a } }) }
  if (act === 'wz-cancel') return run(() => { S.wizard = null });
  if (act === 'wz-back' || act === 'wz-next') {
    const w = S.wizard, key = QUESTIONS[w.step][0], raw = $('#wz').value;
    w.answers[key] = Array.isArray(w.answers[key]) ? raw.split('\n').map(s => s.trim()).filter(Boolean) : raw.trim();
    if (act === 'wz-back') return run(() => { w.step-- });
    if (w.step === QUESTIONS.length - 1) { if (!w.answers.product || w.answers.wants.length < 1 || !w.answers.eligibility) return toast('Product, questions and eligibility are required'); return run(() => { saveBrief(w.answers); S.wizard = null; toast(`Brief v${latestBrief().v} saved`) }) }
    return run(() => { w.step++ });
  }
  if (act === 'inv-yes') return run(() => { r.inviteStep = 1 });
  if (act === 'elig-yes') return run(() => { r.inviteStep = 2 });
  if (act === 'inv-no') return run(() => { r.seat = 'released'; log('Invite declined', r.pseudonym, { business: true, reviewers: [r.id] }) });
  if (act === 'knew') return run(() => { acceptSeat(r.id, v); toast('Seat accepted') });
  if (act === 'submit-review') {
    const b = brief(); const sections = b.wants.map((_, i) => $('#sec' + i).value.trim()); const closing = [0, 1, 2].map(i => $('#clo' + i).value.trim());
    if (sections.some(s => !s)) return toast('Every section needs an answer');
    S.busy = 'Scoring against the brief'; render(); await submitReview(r.id, sections, closing); S.busy = null; S.page = 'home'; toast('Review submitted'); return run(() => {});
  }
  if (act === 'bugform') return run(() => { S.bugForm = true });
  if (act === 'bugform-close') return run(() => { S.bugForm = false });
  if (act === 'submit-bug') {
    const data = { title: $('#bug-title').value.trim(), happened: $('#bug-happened').value.trim(), instead: $('#bug-instead').value.trim(), where: $('#bug-where').value.trim() };
    if (!data.title || !data.happened) return toast('Title and what happened are required');
    S.busy = 'Checking for duplicates'; render(); const dup = await findDuplicate({ ...data, reviewerId: r.id }); S.busy = null;
    if (dup) return run(() => { S.pendingDup = { reviewerId: r.id, data, match: dup } });
    S.busy = 'Categorising'; render(); await submitBug(r.id, data, null); S.busy = null; S.bugForm = false; toast('Issue reported'); return run(() => {});
  }
  if (act === 'dup-confirm') { const d = S.pendingDup; S.pendingDup = null; S.bugForm = false; await submitBug(d.reviewerId, d.data, d.match.id); toast('Confirmation added'); return run(() => {}) }
  if (act === 'dup-anyway') { const d = S.pendingDup; S.pendingDup = null; S.busy = 'Categorising'; render(); await submitBug(d.reviewerId, d.data, null); S.busy = null; S.bugForm = false; toast('Issue reported'); return run(() => {}) }
  if (act === 'dup-cancel') return run(() => { S.pendingDup = null });
  if (act === 'submit-ratings') {
    const mine = cur(S.reviews).filter(rv => S.assignments[rv.id].includes(r.id));
    const entries = mine.map(rv => ({ reviewId: rv.id, truthful: $(`#rt-${rv.id}-truthful`).value === 'yes', fair: $(`#rt-${rv.id}-fair`).value === 'yes', matches: $(`#rt-${rv.id}-matches`).value, useful: Number($(`#rt-${rv.id}-useful`).value), flag: $(`#rt-${rv.id}-flag`).value || null }));
    return run(() => { submitRatings(r.id, entries); toast('Ratings submitted') });
  }
  if (act === 'reply') { const f = S.flags.find(x => x.id === id); const t = $('#reply-' + id).value.trim(); if (!t) return; return run(() => { f.reply = t; log('Reply to flag', `${r.pseudonym}: ${t}`, { business: false, reviewers: [r.id] }); toast('Reply sent') }) }
});
document.addEventListener('change', ev => {
  const el = ev.target; if (!el.dataset.act) return;
  if (el.dataset.act === 'logwho') { S.logWho = el.value; save(); render() }
  if (el.dataset.act === 'received') { reviewer(S.who).received = el.checked; save() }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && (S.drawer || S.menu || S.side)) { S.drawer = null; S.menu = false; S.side = false; render() } });
$('#scrim').addEventListener('click', () => { S.side = false; render() });

(async () => { S = load(); if (!S) await seed(); S.busy = null; S.menu = false; S.side = false; render() })();
</script>
